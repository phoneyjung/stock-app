    </div>
  );

  const pickCatImg = async e => {
    const file = e.target.files && e.target.files[0];
    if (!file || !catTarget) return;
    await savePhoto("cat:" + catTarget, await compressImg(file, 300, 0.6));
    say("ใส่รูปหมวดแล้ว ✓");
  };

  return (
    <div style={{ padding:"14px 16px" }}>
      <div className="card" style={{ padding:14, marginBottom:14 }}>
        <div className="row" style={{ marginBottom:10 }}>
          <div style={{ fontWeight:600, flex:1 }}>🏪 ร้าน</div>
          <button className="btn press" style={{ padding:"7px 13px", fontSize:13 }}
            onClick={() => setSheet({ type:"shop", data:null })}>➕ เพิ่ม</button>
        </div>
        {shops.map(s => (
          <div key={s.id} className="kv">
            <span className="row">
              <span style={{ width:14, height:14, borderRadius:5, background:colorOf(s.color).head, flex:"none" }}></span>
              {logoOf(logos, s.id)
                ? <img src={logoOf(logos, s.id)} alt="" style={{ width:28, height:28, borderRadius:999, objectFit:"cover" }} />
                : <span style={{ fontSize:19 }}>{s.emo || "🏪"}</span>}
              <span>{s.name}</span>
            </span>
            <button className="chip press" onClick={() => setSheet({ type:"shop", data:s })}>แก้ไข</button>
          </div>
        ))}
      </div>

      <div className="card" style={{ padding:14, marginBottom:14 }}>
        <div style={{ fontWeight:600, marginBottom:4 }}>🗂 หมวดหมู่</div>
        <div style={{ fontSize:11.5, color:"var(--muted)", marginBottom:10 }}>แตะรูปเพื่อใส่ภาพประกอบหมวด</div>
        <div style={{ display:"grid", gap:7, marginBottom:10 }}>
          {cats.map(c => (
            <div key={c} className="row" style={{ gap:9 }}>
              <div className="press" onClick={() => { setCatTarget(c); setTimeout(() => catRef.current && catRef.current.click(), 30); }}
                style={{ width:40, height:40, borderRadius:11, background:"var(--soft)", overflow:"hidden",
                  display:"flex", alignItems:"center", justifyContent:"center", fontSize:16, flex:"none" }}>
                {photos["cat:" + c] ? <img src={photos["cat:" + c]} alt="" style={{ width:"100%", height:"100%", objectFit:"cover" }} /> : "🗂"}
              </div>
              <span style={{ flex:1, fontSize:14 }}>{c}</span>
              {photos["cat:" + c] ? <button className="chip press" onClick={() => savePhoto("cat:" + c, null)}>ลบรูป</button> : null}
              <button className="press" onClick={() => {
                const used = items.filter(i => i.cat === c).length;
                if (used) { say(`ยังมี ${used} รายการใช้หมวดนี้`); return; }
                saveMeta(cats.filter(x => x !== c), null);
              }} style={{ color:"var(--red)", width:30 }}>✕</button>
            </div>
          ))}
        </div>
        <input ref={catRef} type="file" accept="image/*" onChange={pickCatImg} style={{ display:"none" }} />
        <div className="row">
          <input value={newCat} onChange={e => setNewCat(e.target.value)} placeholder="เพิ่มหมวดใหม่" />
          <button className="btn ghost press" onClick={() => {
            const v = newCat.trim(); if (!v || cats.includes(v)) return;
            saveMeta([...cats, v], null); setNewCat("");
          }}>เพิ่ม</button>
        </div>
      </div>

      <div className="card" style={{ padding:14, marginBottom:14 }}>
        <div style={{ fontWeight:600, marginBottom:10 }}>📏 หน่วยนับ</div>
        <div style={{ display:"flex", gap:7, flexWrap:"wrap", marginBottom:10 }}>
          {units.map(u => (
            <span key={u} className="chip" style={{ display:"inline-flex", gap:6, alignItems:"center" }}>
              {u}<button className="press" onClick={() => saveMeta(null, units.filter(x => x !== u))} style={{ color:"var(--red)" }}>✕</button>
            </span>
          ))}
        </div>
        <div className="row">
          <input value={newUnit} onChange={e => setNewUnit(e.target.value)} placeholder="เพิ่มหน่วยใหม่" />
          <button className="btn ghost press" onClick={() => {
            const v = newUnit.trim(); if (!v || units.includes(v)) return;
            saveMeta(null, [...units, v]); setNewUnit("");
          }}>เพิ่ม</button>
        </div>
      </div>

      <div className="card" style={{ padding:14, marginBottom:14 }}>
        <div style={{ fontWeight:600, marginBottom:4 }}>🏬 ร้านที่ซื้อของ</div>
        <div style={{ fontSize:11.5, color:"var(--muted)", marginBottom:10 }}>
          ใช้ร่วมกันทุกสาขา · เลือกตอนเพิ่มรายการ และใช้แยกกลุ่มในใบสั่งของ
        </div>
        <div style={{ display:"grid", gap:7, marginBottom:10 }}>
          {!vendors.length ? <div style={{ fontSize:13, color:"var(--muted)" }}>ยังไม่มี — พิมพ์เพิ่มข้างล่าง หรือพิมพ์ตอนสร้างรายการ ระบบจะจำให้เอง</div> : null}
          {vendors.map(v => {
            const used = items.filter(i => i.vendor === v).length;
            return (
              <div key={v} className="row" style={{ gap:9 }}>
                <span style={{ flex:1, fontSize:14 }}>{v}
                  <span style={{ color:"var(--muted)", fontSize:11.5 }}>{used ? ` · ${used} รายการ` : ""}</span>
                </span>
                <button className="press" onClick={() => {
                  if (used) { say(`ยังมี ${used} รายการซื้อจากร้านนี้`); return; }
                  saveVendors(vendors.filter(x => x !== v));
                }} style={{ color:"var(--red)", width:30 }}>✕</button>
              </div>
            );
          })}
        </div>
        <div className="row">
          <input value={newVendor} onChange={e => setNewVendor(e.target.value)} placeholder="เพิ่มร้านใหม่" />
          <button className="btn ghost press" onClick={() => {
            const v = newVendor.trim(); if (!v || vendors.includes(v)) return;
            saveVendors([...vendors, v]); setNewVendor("");
          }}>เพิ่ม</button>
        </div>
      </div>

      <div className="card" style={{ padding:14, marginBottom:14 }}>
        <div className="press" onClick={() => setTapCount(c => c + 1)}
          style={{ fontWeight:600, marginBottom:10 }}>💾 ข้อมูล</div>
        <div style={{ display:"grid", gap:8 }}>
          <button className="btn ghost press" onClick={exportJson}>⬇️ สำรองรายการร้านนี้ (.json)</button>
          <button className="btn ghost press" onClick={() => impRef.current && impRef.current.click()}>⬆️ นำเข้าไฟล์สำรอง</button>
        </div>
        {tapCount >= 5 ? (
          <div style={{ marginTop:14, paddingTop:14, borderTop:"1px dashed var(--line)" }}>
            <div style={{ fontSize:12.5, color:"var(--red)", fontWeight:500, marginBottom:8 }}>
              ⚠️ โซนอันตราย — ใช้ตอนตั้งค่าระบบเท่านั้น
            </div>
            <div style={{ display:"grid", gap:8 }}>
              <button className="btn gold press" onClick={loadSeed}>✨ โหลดข้อมูลตัวอย่าง</button>
              <button className="btn danger press" onClick={cleanupSeed}>🧹 ลบข้อมูลตัวอย่างออก</button>
              <button className="btn danger press" onClick={wipeShop} style={{ background:"#7A2733" }}>
                🗑 ล้างข้อมูลร้านนี้ทั้งหมด
              </button>
              <button className="btn danger press" onClick={resetAll} style={{ background:"#5A1B24" }}>
                ☢️ ล้างข้อมูลทุกร้าน (เก็บร้านไว้)
              </button>
              <button className="btn ghost press" onClick={() => setTapCount(0)}>ซ่อนกลับ</button>
            </div>
          </div>
        ) : null}
        <div style={{ fontSize:11.5, color:"var(--muted)", marginTop:8, lineHeight:1.6 }}>
          🧹 ลบเฉพาะของที่ระบบสร้างให้ · ของที่คุณเพิ่มหรือแก้เองไม่หาย<br/>
          🗑 ล้างทุกอย่างของร้านที่เปิดอยู่ รวมประวัติ<br/>☢️ ล้างของทุกร้านพร้อมกัน แต่ชื่อร้าน สี ลาย โลโก้ ยังอยู่ครบ<br/>ทุกปุ่มกู้คืนไม่ได้ — ควรกด ⬇️ สำรองก่อนเสมอ
        </div>
        <input ref={impRef} type="file" accept=".json,application/json" style={{ display:"none" }}
          onChange={e => { const f = e.target.files && e.target.files[0]; if (f) importJson(f); e.target.value = ""; }} />
      </div>

      <div className="card" style={{ padding:14, marginBottom:14 }}>
        <div style={{ fontWeight:600, marginBottom:10 }}>🔌 การเชื่อมต่อ</div>
        <div className="kv"><span style={{ color:"var(--muted)" }}>โหมด</span>
          <b style={{ color: LOCAL_MODE ? "var(--red)" : "var(--green)" }}>
            {LOCAL_MODE ? "🧪 ทดลอง (ไม่ซิงก์)" : online ? "🟢 ออนไลน์" : "⚪ กำลังต่อ"}
          </b></div>
        <div className="kv"><span style={{ color:"var(--muted)" }}>ฐานข้อมูล</span>
          <span style={{ fontSize:12.5 }}>{FIREBASE_CONFIG.projectId || "—"}</span></div>
        <div className="kv"><span style={{ color:"var(--muted)" }}>ที่อยู่เว็บ</span>
          <span style={{ fontSize:11.5, wordBreak:"break-all", textAlign:"right" }}>{location.origin + location.pathname}</span></div>
        <div className="kv"><span style={{ color:"var(--muted)" }}>ร้านที่เปิดอยู่</span>
          <span style={{ fontSize:12.5 }}>{shop ? shop.id : "—"} · {items.length} รายการ</span></div>
        <div className="kv"><span style={{ color:"var(--muted)" }}>ซิงก์ล่าสุด</span>
          <span style={{ fontSize:12.5 }}>{lastSync ? new Date(lastSync).toLocaleTimeString("th-TH") : "ยังไม่เคย"}</span></div>
        {dbError ? <div className="kv"><span style={{ color:"var(--red)" }}>ข้อผิดพลาด</span>
          <span style={{ fontSize:11.5, color:"var(--red)", textAlign:"right", wordBreak:"break-word" }}>{dbError}</span></div> : null}

        <button className="btn ghost press" style={{ width:"100%", marginTop:10 }} onClick={async () => {
          if (LOCAL_MODE) { alert("เครื่องนี้อยู่ในโหมดทดลอง\n\nแปลว่าเปิดจากไฟล์ที่ไม่มี firebase-config.js อยู่ข้างๆ\nให้เปิดจาก\nphoneyjung.github.io/stock-app/\nเท่านั้น"); return; }
          say("กำลังทดสอบ…");
          const stamp = Date.now();
          const w = await setDoc("stockApp/diag", { ts: stamp, from: navigator.userAgent.slice(0, 60) });
          const r = await getDoc("stockApp/diag");
          if (w && r && r.ts === stamp) alert("✅ เชื่อมต่อปกติ\n\nเขียนและอ่านฐานข้อมูลสำเร็จ\nถ้าอีกเครื่องยังไม่เห็นข้อมูล ให้เช็กว่าเปิดที่อยู่เว็บเดียวกัน และเลือกร้านเดียวกัน");
          else alert("❌ เขียนฐานข้อมูลไม่สำเร็จ\n\nให้เพิ่ม Firestore Rules ต่อไปนี้:\n\nmatch /stockApp/{d}    { allow read, write: if ok(); }\nmatch /stockItems/{d}  { allow read, write: if ok(); }\nmatch /stockCounts/{d} { allow read, write: if ok(); }\nmatch /stockOrders/{d} { allow read, write: if ok(); }\nmatch /stockPhotos/{d} { allow read, write: if ok(); }");
        }}>🧪 ทดสอบการเชื่อมต่อ</button>
      </div>

      <div className="card" style={{ padding:14 }}>
        <div style={{ fontWeight:600, marginBottom:10 }}>🔑 PIN เจ้าของ</div>
        <div className="row">
          <input value={pin} onChange={e => setPin(e.target.value)} inputMode="numeric" />
          <button className="btn press" onClick={async () => {
            const v = pin.trim(); if (v.length < 4) { say("อย่างน้อย 4 หลัก"); return; }
            await setDoc("stockApp/config", { ownerPin: v }); setCfg({ ownerPin: v }); say("บันทึกแล้ว ✓");
          }}>บันทึก</button>
        </div>
      </div>
    </div>
  );
}

/* ---------- Sheet: ร้าน ---------- */
function ShopSheet({ shop, shops, logo, onClose, onSave, onDelete }) {
  const [f, setF] = useState(() => shop ? { ...shop } : { id:"", name:"", emo:"🏪", color:"", bg:"none" });
  const [img, setImg] = useState(logo || null);
  const [dirty, setDirty] = useState(false);
  const fileRef = useRef(null);
  const set = (k, v) => setF(p => ({ ...p, [k]: v }));
  const pickLogo = async e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setImg(await compressImg(file, 240, 0.85)); setDirty(true);
  };
  const usedColors = shops.filter(s => !shop || s.id !== shop.id).map(s => s.color);
  const free = PALETTE.filter(c => !usedColors.includes(c.k));

  useEffect(() => { if (!f.color && free.length) set("color", free[0].k); }, []);

  return (
    <Sheet title={shop ? "แก้ไขร้าน" : "เพิ่มร้าน"} onClose={onClose}>
      <div className="row" style={{ marginBottom:14 }}>
        <div className="press" onClick={() => fileRef.current && fileRef.current.click()}
          style={{ width:78, height:78, borderRadius:999, background:"var(--soft)", display:"flex",
            alignItems:"center", justifyContent:"center", overflow:"hidden", fontSize:28, flex:"none",
            border:"2px solid var(--line)" }}>
          {img ? <img src={img} alt="" style={{ width:"100%", height:"100%", objectFit:"cover" }} /> : f.emo}
        </div>
        <div style={{ flex:1 }}>
          <div style={{ fontSize:12.5, color:"var(--muted)" }}>แตะเพื่อใส่โลโก้ร้าน</div>
          <div style={{ fontSize:11, color:"var(--muted)", marginTop:2 }}>รูปจะถูกตัดเป็นวงกลม</div>
          {img ? <button className="chip press" style={{ marginTop:6, color:"var(--red)" }}
            onClick={() => { setImg(null); setDirty(true); }}>ลบโลโก้</button> : null}
        </div>
        <input ref={fileRef} type="file" accept="image/*" onChange={pickLogo} style={{ display:"none" }} />
      </div>

      <Field label="ชื่อร้าน"><input value={f.name} onChange={e => set("name", e.target.value)} placeholder="เช่น Teddy สาขา 2" /></Field>
      <Field label="รหัสร้าน" hint={shop ? "แก้ไม่ได้" : "อังกฤษ ห้ามซ้ำ"}>
        <input value={f.id} disabled={!!shop} onChange={e => set("id", e.target.value.replace(/[^a-z0-9_]/g, ""))} placeholder="teddy2" />
      </Field>
      <Field label="ไอคอนสำรอง" hint="ใช้เมื่อไม่ได้ใส่โลโก้">
        <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
          {["🏪","🧺","🪷","🧋","☕","🧼","💧","🛒","🍜","💈"].map(e => (
            <button key={e} className={"chip press " + (f.emo === e ? "on" : "")}
              onClick={() => set("emo", e)} style={{ fontSize:18 }}>{e}</button>
          ))}
        </div>
      </Field>

      <Field label="สีประจำร้าน" hint="ห้ามซ้ำกับร้านอื่น">
        <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(88px,1fr))", gap:8 }}>
          {PALETTE.map(c => {
            const taken = usedColors.includes(c.k);
            const on = f.color === c.k;
            return (
              <button key={c.k} className="press" disabled={taken} onClick={() => set("color", c.k)}
                style={{ padding:"9px 6px", borderRadius:13, background: c.tint, opacity: taken ? .3 : 1,
                  border:"2px solid " + (on ? c.head : "transparent"), textAlign:"center" }}>
                <span style={{ display:"block", width:"100%", height:20, borderRadius:7, background:c.head, marginBottom:5 }}></span>
                <span style={{ fontSize:10.5, color:c.head }}>{c.n}</span>
              </button>
            );
          })}
        </div>
      </Field>

      <Field label="ลายพื้นหลัง" hint="แสดงบนสีที่เลือกไว้">
        <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(84px,1fr))", gap:8 }}>
          {BGS.map(b => {
            const on = f.bg === b.k;
            return (
              <button key={b.k} className="press" onClick={() => set("bg", b.k)}
                style={{ padding:0, borderRadius:13, overflow:"hidden", textAlign:"center",
                  border:"2px solid " + (on ? colorOf(f.color).head : "var(--line)"), background:"#fff" }}>
                <span style={{ display:"block", height:46, backgroundColor:colorOf(f.color).tint,
                  backgroundImage: b.f ? `url('${b.f}')` : "none", backgroundSize:"96px 96px" }}></span>
                <span style={{ display:"block", fontSize:10.5, padding:"4px 2px", color:"var(--muted)" }}>{b.n}</span>
              </button>
            );
          })}
        </div>
      </Field>

      <div className="row" style={{ gap:8, marginTop:8 }}>
        {shop ? <button className="btn danger press" onClick={() => onDelete(shop)}>ลบ</button> : null}
        <button className="btn press" style={{ flex:1 }} onClick={() => {
          const id = (f.id || "").trim(), name = (f.name || "").trim();
          if (!id || !name) { alert("ใส่ชื่อร้านและรหัสร้าน"); return; }
          if (!f.color) { alert("เลือกสีประจำร้าน"); return; }
          onSave({ ...f, id, name }, dirty ? img : undefined);
        }}>บันทึก</button>
      </div>
    </Sheet>
  );
}

      "จัดกลุ่มตามร้านที่ซื้อให้เลย ส่งให้ลูกน้องไปซื้อได้ทีละร้าน",
      "คัดลอกเป็นข้อความ หรือส่งเป็นรูป แล้วกดบันทึกใบสั่งของไว้ดูย้อนหลัง",
    ]},
    { k:"hist", t:"🕘 ประวัติ", body:[
      "ดูการนับและใบสั่งของย้อนหลังได้ 18 เดือน",
      "แตะที่รายการเพื่อดูรายละเอียด และคัดลอก/ส่งรูปซ้ำได้",
      "เจ้าของลบรายการที่ผิดได้",
    ]},
    { k:"undo", t:"↩︎ ปุ่มเลิกทำ", body:[
      "กด ↩︎ มุมขวาบน = ย้อนสิ่งที่เพิ่งทำล่าสุด",
      "ย้อนได้ 20 ครั้ง ภายใน 1 ชั่วโมง",
      "ย้อนได้เฉพาะสิ่งที่ทำจากเครื่องนี้",
    ]},
    { k:"owner", t:"👑 เจ้าของ (ใส่ PIN)", body:[
      "กด 👤 มุมขวาบนแล้วใส่ PIN",
      "เพิ่ม/แก้/ลบ ร้าน หมวด หน่วยนับ และลบรายการได้",
      "แต่ละร้านมีสีของตัวเอง เปลี่ยนร้านแล้วสีพื้นหลังเปลี่ยนตาม",
      "สำรองข้อมูลเป็นไฟล์ .json ได้ในหน้าตั้งค่า",
    ]},
  ];
  return (
    <Sheet title="วิธีใช้งาน" onClose={onClose}>
      <div style={{ display:"grid", gap:8 }}>
        {SEC.map(sec => (
          <div key={sec.k} className="card" style={{ overflow:"hidden" }}>
            <button className="press" onClick={() => setOpen(open === sec.k ? "" : sec.k)}
              style={{ width:"100%", textAlign:"left", padding:"13px 14px", display:"flex", alignItems:"center", gap:8 }}>
              <span style={{ flex:1, fontWeight:500, fontSize:14.5 }}>{sec.t}</span>
              <span style={{ color:"var(--muted)", fontSize:12 }}>{open === sec.k ? "▲" : "▼"}</span>
            </button>
            {open === sec.k ? (
              <div style={{ padding:"0 14px 14px", borderTop:"1px solid var(--line)" }}>
                {sec.body.map((line, i) => (
                  <div key={i} style={{ display:"flex", gap:8, marginTop:10, fontSize:13.5, lineHeight:1.6 }}>
                    <span style={{ color:"var(--gold)" }}>•</span><span style={{ flex:1 }}>{line}</span>
                  </div>
                ))}
              </div>
            ) : null}
          </div>
        ))}
      </div>
      <button className="btn ghost press" style={{ width:"100%", marginTop:12 }} onClick={onInstall}>
        📲 ติดตั้งลงหน้าจอหลัก
      </button>
      <div style={{ fontSize:12, color:"var(--muted)", textAlign:"center", marginTop:16, lineHeight:1.7 }}>
        {isOwner ? "👑 ตอนนี้อยู่ในโหมดเจ้าของ" : "👤 ตอนนี้อยู่ในโหมดพนักงาน"}<br/>
        ข้อมูลซิงก์อัตโนมัติทุกเครื่องที่เปิดลิงก์เดียวกัน
      </div>
    </Sheet>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script>
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function(){});
</script>
</body>
</html>
