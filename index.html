<style>
:root{
  --head:#113D6C; --tint:#F2F6FB;
  --card:#FFFFFF; --gold:#C68B4A; --ink:#1F2A37; --muted:#8A94A0;
  --line:#E7E2D8; --soft:#F3F0E8; --red:#BA3D4D; --green:#2E7D5B;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Kanit',system-ui,sans-serif; color:var(--ink);
  background-color:var(--tint); background-repeat:repeat; background-size:256px 256px;
  background-attachment:fixed;
  font-weight:400; font-size:15px; padding-bottom:env(safe-area-inset-bottom);
  transition:background-color .25s ease;
}
#root{max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;
  box-shadow:0 2px 10px rgba(20,30,45,.05)}
.press{cursor:pointer;transition:transform .08s ease}
.press:active{transform:scale(.975)}
button{font-family:inherit;font-size:inherit;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink);
  border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:-1px}
.btn{background:var(--head);color:#fff;border-radius:14px;padding:12px 16px;font-weight:500;
  display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.gold{background:var(--gold)}
.btn.ghost{background:var(--soft);color:var(--head)}
.btn.danger{background:var(--red)}
.btn:disabled{opacity:.45}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;
  font-size:13px;white-space:nowrap}
.chip.on{background:var(--head);color:#fff;border-color:var(--head)}
.row{display:flex;align-items:center;gap:10px}
.scroll-x{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 8px;scrollbar-width:none}
.scroll-x::-webkit-scrollbar{display:none}
.lbl{font-size:12px;color:var(--muted);margin-bottom:4px;display:block}
.hdr{color:#fff;border-radius:0 0 26px 26px;padding:14px 16px 18px;position:relative;overflow:hidden;
  background:var(--head)}
.hdr::before{content:"";position:absolute;inset:0;z-index:0;
  background:linear-gradient(115deg,rgba(0,0,0,.22),rgba(255,255,255,.10))}
.hdr>*{position:relative;z-index:1}
.tag{font-size:11px;padding:3px 8px;border-radius:999px;font-weight:500}
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(15,25,40,.45)}
.sheet-in{position:relative;background:var(--tint);width:100%;max-width:560px;
  border-radius:24px 24px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));
  max-height:90vh;overflow:auto;animation:up .18s ease}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(255,255,255,.97);
  backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding:6px 0 calc(6px + env(safe-area-inset-bottom));display:flex}
.nav>button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 0;font-size:10.5px;color:var(--muted)}
.nav>button.on{color:var(--head);font-weight:500}
.nav .ic{font-size:20px;line-height:1}
.thumb{width:48px;height:48px;border-radius:12px;object-fit:cover;background:var(--soft);
  display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:none}
.empty{text-align:center;color:var(--muted);padding:36px 20px;font-size:14px}
.emptypic{width:140px;height:140px;object-fit:contain;opacity:.92;margin:0 auto 6px;display:block;border-radius:20px}
.sect{font-weight:600;font-size:13px;color:var(--muted);margin:16px 16px 7px}

const THMON = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
const thDate = s => { if (!s) return "-"; const [y,m,d] = s.split("-"); return `${+d} ${THMON[+m-1]} ${(+y+543)%100}`; };

const MEM = {};

  get(k) { try { const v = localStorage.getItem(k); return v === null ? (MEM[k] === undefined ? null : MEM[k]) : v; } catch (e) { return MEM[k] === undefined ? null : MEM[k]; } },
  set(k, v) { MEM[k] = v; try { localStorage.setItem(k, v); } catch (e) {} }

function compressImg(file, max, q) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const im = new Image();
      im.onload = () => {
        let { width:w, height:h } = im;
        const sc = Math.min(1, max / Math.max(w, h));
        w = Math.round(w * sc); h = Math.round(h * sc);
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        const x = c.getContext("2d");
        x.fillStyle = "#fff"; x.fillRect(0, 0, w, h);
        x.drawImage(im, 0, 0, w, h);
        res(c.toDataURL("image/jpeg", q));
      };
      im.onerror = rej; im.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}
function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = src; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
}

/* ---------- firebase ---------- */
let db = null, fbReady = false;
try {
  if (FIREBASE_CONFIG.apiKey !== "PASTE_API_KEY") {
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
    firebase.auth().signInAnonymously().catch(() => {});
    fbReady = true;
  }
} catch (e) { console.error(e); }

const LOCAL_MODE = !fbReady;
const LKEY = p => "psdb:" + p;

async function getDoc(p) {
  if (LOCAL_MODE) { const v = LS.get(LKEY(p)); try { return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  try { const s = await db.doc(p).get(); return s.exists ? s.data() : null; } catch (e) { console.error(p, e); return null; }
}
async function setDoc(p, data) {
  if (LOCAL_MODE) {
    const old = (await getDoc(p)) || {};
    LS.set(LKEY(p), JSON.stringify({ ...old, ...data }));
    return true;
  }
  try { await db.doc(p).set(data, { merge:true }); return true; } catch (e) { console.error(p, e); return false; }
}
function watchDoc(p, cb) {
  if (LOCAL_MODE) { getDoc(p).then(cb); return () => {}; }
  return db.doc(p).onSnapshot(s => cb(s.exists ? s.data() : null), e => console.error("watch " + p, e));
}
async function txDoc(p, mutate) {
  if (LOCAL_MODE) {
    const cur = (await getDoc(p)) || {};
    const next = mutate(cur);
    LS.set(LKEY(p), JSON.stringify(next));
    return next;
  }
  const ref = db.doc(p);
  return db.runTransaction(async t => {
    const s = await t.get(ref);
    const next = mutate(s.exists ? s.data() : {});
    t.set(ref, next);
    return next;
  });
}

/* ---------- สร้างข้อความ / รูป สำหรับส่งต่อ ---------- */
function buildText(kind, shopName, head, groups, footer) {
  let t = `${kind}  ${shopName}\n${head}\n`;
  groups.forEach(g => {
    t += `\n【${g.title}】\n`;
    g.lines.forEach(l => { t += `• ${l.left}${l.right ? "  —  " + l.right : ""}${l.flag ? " " + l.flag : ""}\n`; });
  });
  if (footer) t += `\n${footer}`;
  return t;
}

function renderImage(opts) {
  const W = 760, P = 34;
  const c = document.createElement("canvas");
  const ctx = c.getContext("2d");
  const F = w => `${w} 20px Kanit, sans-serif`;
  let h = 150;
  opts.groups.forEach(g => { h += 46 + g.lines.length * 38; });
  h += opts.footer ? 90 : 40;
  c.width = W; c.height = h;

  ctx.fillStyle = "#FFFFFF"; ctx.fillRect(0, 0, W, h);
  ctx.fillStyle = opts.color; ctx.fillRect(0, 0, W, 108);
  ctx.fillStyle = "#fff";
  ctx.font = "600 30px Kanit, sans-serif";
  ctx.fillText(opts.title, P, 48);
  ctx.font = "400 19px Kanit, sans-serif";
  ctx.globalAlpha = .85;
  ctx.fillText(opts.head, P, 82);
  ctx.globalAlpha = 1;

  let y = 152;
  opts.groups.forEach(g => {
    ctx.fillStyle = opts.color; ctx.globalAlpha = .10;
    ctx.fillRect(P - 10, y - 24, W - (P - 10) * 2, 34);
    ctx.globalAlpha = 1;
    ctx.fillStyle = opts.color;
    ctx.font = "600 20px Kanit, sans-serif";
    ctx.fillText(g.title, P, y);
    y += 44;
    g.lines.forEach(l => {
      ctx.fillStyle = l.flag ? "#BA3D4D" : "#1F2A37";
      ctx.font = F(l.flag ? 500 : 400);
      let left = l.left;
      while (ctx.measureText(left).width > W - P * 2 - 190) left = left.slice(0, -2);
      if (left !== l.left) left += "…";
      ctx.fillText(left + (l.flag ? "  " + l.flag : ""), P, y);
      if (l.right) {
        ctx.textAlign = "right";
        ctx.font = "600 20px Kanit, sans-serif";
        ctx.fillText(l.right, W - P, y);
        ctx.textAlign = "left";
      }
      ctx.strokeStyle = "#EFEBE2"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(P, y + 12); ctx.lineTo(W - P, y + 12); ctx.stroke();
      y += 38;
    });
    y += 10;
  });

  if (opts.footer) {
    ctx.fillStyle = "#F3F0E8"; ctx.fillRect(0, h - 74, W, 74);
    ctx.fillStyle = "#5A6472"; ctx.font = "500 20px Kanit, sans-serif";
    ctx.fillText(opts.footer, P, h - 30);
  }
  return c;
}

async function shareCanvas(canvas, filename, say) {
  const blob = await new Promise(r => canvas.toBlob(r, "image/png"));
  const file = new File([blob], filename, { type:"image/png" });
  try {
    if (navigator.canShare && navigator.canShare({ files:[file] })) {
      await navigator.share({ files:[file] });
      return;
    }
  } catch (e) { if (e && e.name === "AbortError") return; }
  try {
    await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
    say("คัดลอกรูปแล้ว ✓ วางในไลน์ได้เลย");
    return;
  } catch (e) {}
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  say("บันทึกรูปลงเครื่องแล้ว");
}
function copyText(t, say) {
  navigator.clipboard.writeText(t).then(() => say("คัดลอกข้อความแล้ว ✓"), () => say("คัดลอกไม่ได้"));
}

function App() {
  const [booting, setBooting] = useState(true);
  const [online, setOnline] = useState(false);
  const [shops, setShops] = useState([]);
  const [shopId, setShopId] = useState(LS.get("ps_shop") || "");
  const [role, setRole] = useState(LS.get("ps_role") || "staff");
  const [cfg, setCfg] = useState({ ownerPin:"1234" });
  const [tab, setTab] = useState("stock");

  const [items, setItems] = useState([]);
  const [cats, setCats] = useState(DEFAULT_CATS);
  const [units, setUnits] = useState(DEFAULT_UNITS);
  const [photos, setPhotos] = useState({});
  const [counts, setCounts] = useState({});   // { "YYYY-MM": [session,...] }
  const [orders, setOrders] = useState({});
  const [loadingShop, setLoadingShop] = useState(false);
  const [toast, setToast] = useState("");
  const [sheet, setSheet] = useState(null);
  const [undoStack, setUndoStack] = useState([]);
  const [orderDraft, setOrderDraft] = useState({});   // { itemId: qty }

  const isOwner = role === "owner";
  const shop = useMemo(() => shops.find(s => s.id === shopId) || null, [shops, shopId]);
  const say = m => { setToast(m); setTimeout(() => setToast(""), 2000); };

  /* ---- ธีมตามร้าน ---- */
  useEffect(() => {
    const c = colorOf(shop && shop.color);
    const b = BGS.find(x => x.k === (shop && shop.bg));
    document.documentElement.style.setProperty("--head", c.head);
    document.documentElement.style.setProperty("--tint", c.tint);
    document.body.style.backgroundImage = (b && b.f) ? `url('${b.f}')` : "none";
    const m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute("content", c.head);
  }, [shop]);

  /* ---- boot ---- */
  useEffect(() => {
    const u1 = watchDoc("stockApp/shops", d => { setShops((d && d.list) || []); setOnline(true); setBooting(false); });
    const u2 = watchDoc("stockApp/config", d => { if (d) setCfg({ ownerPin: d.ownerPin || "1234" }); });
    const t = setTimeout(() => setBooting(false), 6000);
    return () => { u1(); u2(); clearTimeout(t); };
  }, []);

  useEffect(() => {
    if (shops.length && !shops.some(x => x.id === shopId)) setShopId(shops[0].id);
  }, [shops]);

  /* ---- ข้อมูลร้าน ---- */
  useEffect(() => {
    if (!shopId) return;
    setLoadingShop(true); setCounts({}); setOrders({}); setOrderDraft({});
    setUndoStack(readUndo(shopId));
    const mk = monthOf(today());
    const u1 = watchDoc("stockItems/" + shopId, d => {
      setItems((d && d.items) || []);
      setCats((d && d.cats && d.cats.length) ? d.cats : DEFAULT_CATS);
      setUnits((d && d.units && d.units.length) ? d.units : DEFAULT_UNITS);
      setLoadingShop(false);
    });
    const u2 = watchDoc("stockPhotos/" + shopId, d => setPhotos((d && d.p) || {}));
    const u3 = watchDoc(`stockCounts/${shopId}_${mk}`, d => setCounts(p => ({ ...p, [mk]: (d && d.list) || [] })));
    const u4 = watchDoc(`stockOrders/${shopId}_${mk}`, d => setOrders(p => ({ ...p, [mk]: (d && d.list) || [] })));
    (async () => {
      for (const m of lastMonths(3).slice(1)) {
        const c = await getDoc(`stockCounts/${shopId}_${m}`);
        setCounts(p => ({ ...p, [m]: (c && c.list) || [] }));
      }
    })();
    LS.set("ps_shop", shopId);
    return () => { u1(); u2(); u3(); u4(); };
  }, [shopId]);

  /* ---- undo ---- */
  const UNDO_TTL = 60 * 60 * 1000;
  const readUndo = sid => {
    try { return (JSON.parse(LS.get("ps_undo:" + sid) || "[]")).filter(e => Date.now() - e.ts < UNDO_TTL); }
    catch (e) { return []; }
  };
  const writeUndo = (sid, arr) => { LS.set("ps_undo:" + sid, JSON.stringify(arr)); setUndoStack(arr); };
  const pushUndo = entry => { if (shopId) writeUndo(shopId, [{ ...entry, id:uid(), ts:Date.now() }, ...readUndo(shopId)].slice(0, 20)); };
  useEffect(() => {
    const t = setInterval(() => setUndoStack(readUndo(shopId)), 60000);
    return () => clearInterval(t);
  }, [shopId]);

  /* ---- writers ---- */
  const saveMeta = async (nextCats, nextUnits) => {
    if (nextCats) setCats(nextCats);
    if (nextUnits) setUnits(nextUnits);
    await txDoc("stockItems/" + shopId, cur => ({
      ...cur, items: cur.items || items,
      cats: nextCats || cur.cats || cats, units: nextUnits || cur.units || units
    }));
  };
  const upsertItem = async (it, undoLabel) => {
    const before = items.find(x => x.id === it.id) || null;
    setItems(prev => prev.some(x => x.id === it.id) ? prev.map(x => x.id === it.id ? it : x) : [...prev, it]);
    await txDoc("stockItems/" + shopId, cur => {
      const arr = (cur.items || []).slice();
      const k = arr.findIndex(x => x.id === it.id);
      if (k >= 0) arr[k] = it; else arr.push(it);
      return { ...cur, items: arr, cats: cur.cats || cats, units: cur.units || units };
    });
    if (undoLabel) pushUndo({ kind:"item", label:undoLabel, before, after:it });
  };
  const removeItem = async (id, undoLabel) => {
    const before = items.find(x => x.id === id) || null;
    setItems(prev => prev.filter(x => x.id !== id));
    await txDoc("stockItems/" + shopId, cur => ({ ...cur, items: (cur.items || []).filter(x => x.id !== id) }));
    if (undoLabel && before) pushUndo({ kind:"itemDel", label:undoLabel, item:before, photo:photos[id] || null });
  };
  const savePhoto = async (key, dataUrl) => {
    await txDoc("stockPhotos/" + shopId, cur => {
      const p = { ...(cur.p || {}) };
      if (dataUrl) p[key] = dataUrl; else delete p[key];
      return { p };
    });
  };
  const saveShops = async list => { setShops(list); await txDoc("stockApp/shops", () => ({ list })); };

  const saveCount = async session => {
    const mk = monthOf(session.date);
    setCounts(p => ({ ...p, [mk]: [session, ...(p[mk] || [])] }));
    await txDoc(`stockCounts/${shopId}_${mk}`, cur => ({ list: [session, ...(cur.list || [])] }));
    pushUndo({ kind:"count", label:`บันทึกการนับ ${thDate(session.date)}`, mk, sid:session.id });
  };
  const saveOrder = async order => {
    const mk = monthOf(order.date);
    setOrders(p => ({ ...p, [mk]: [order, ...(p[mk] || [])] }));
    await txDoc(`stockOrders/${shopId}_${mk}`, cur => ({ list: [order, ...(cur.list || [])] }));
    pushUndo({ kind:"order", label:`บันทึกใบสั่งของ ${thDate(order.date)}`, mk, sid:order.id });
  };
  const delRecord = async (type, mk, id) => {
    const path = `${type === "count" ? "stockCounts" : "stockOrders"}/${shopId}_${mk}`;
    const setter = type === "count" ? setCounts : setOrders;
    setter(p => ({ ...p, [mk]: (p[mk] || []).filter(x => x.id !== id) }));
    await txDoc(path, cur => ({ list: (cur.list || []).filter(x => x.id !== id) }));
    say("ลบแล้ว");
  };
  const loadMonth = async (type, mk) => {
    const store = type === "count" ? counts : orders;
    if (store[mk]) return;
    const d = await getDoc(`${type === "count" ? "stockCounts" : "stockOrders"}/${shopId}_${mk}`);
    (type === "count" ? setCounts : setOrders)(p => ({ ...p, [mk]: (d && d.list) || [] }));
  };

  const undoLast = async () => {
    const stack = readUndo(shopId);
    if (!stack.length) { say("ไม่มีอะไรให้ย้อนกลับ"); return; }
    const e = stack[0];
    if (!confirm("เลิกทำ:\n" + e.label + "\n\nยืนยัน?")) return;
    try {
      if (e.kind === "item") { if (e.before) await upsertItem(e.before, null); else await removeItem(e.after.id, null); }
      else if (e.kind === "itemDel") { await upsertItem(e.item, null); if (e.photo) await savePhoto(e.item.id, e.photo); }
      else if (e.kind === "count") await delRecord("count", e.mk, e.sid);
      else if (e.kind === "order") await delRecord("order", e.mk, e.sid);
      writeUndo(shopId, stack.slice(1));
      say("ย้อนกลับแล้ว ✓");
    } catch (err) { alert("ย้อนกลับไม่สำเร็จ: " + err.message); }
  };

  const askOwner = () => {
    if (isOwner) { setRole("staff"); LS.set("ps_role","staff"); say("โหมดพนักงาน"); return; }
    const p = prompt("ใส่ PIN เจ้าของ");
    if (p === null) return;
    if (p === cfg.ownerPin) { setRole("owner"); LS.set("ps_role","owner"); say("โหมดเจ้าของ ✓"); }
    else say("PIN ไม่ถูกต้อง");
  };

  const loadSeed = async () => {
    if (shops.length && !confirm("เพิ่มร้านตัวอย่าง? ร้านเดิมไม่ถูกลบ")) return;
    say("กำลังสร้าง…");
    const merged = shops.slice();
    for (const s of SEED.shops) {
      if (!merged.some(x => x.id === s.id)) merged.push(s);
      const cur = await getDoc("stockItems/" + s.id);
      if (!cur || !(cur.items || []).length) await setDoc("stockItems/" + s.id, SEED.build(s.id));
    }
    await saveShops(merged);
    setShopId(merged[0].id);
    say("โหลดข้อมูลตัวอย่างแล้ว ✓");
  };
  /* เช็คว่าเป็นข้อมูลตัวอย่างไหม — ดูทั้งธงและชื่อ เผื่อข้อมูลเก่าที่ยังไม่มีธง */
  const isSeedShop = sh => sh.seed === true || SEED.shops.some(x => x.id === sh.id);
  const seedNameSet = id => {
    if (!SEED.shops.some(x => x.id === id)) return null;
    return new Set(SEED.build(id).items.map(i => i.name));
  };
  const clearRecords = async sid => {
    for (const m of lastMonths(12)) {
      for (const col of ["stockCounts", "stockOrders"]) {
        const d = await getDoc(`${col}/${sid}_${m}`);
        if (d && (d.list || []).length) await setDoc(`${col}/${sid}_${m}`, { list: [] });
      }
    }
  };

  const cleanupSeed = async () => {
    if (!confirm("ลบเฉพาะข้อมูลตัวอย่างที่ระบบสร้างให้\nรายการที่คุณเพิ่มเองจะไม่ถูกลบ\n\nยืนยัน?")) return;
    say("กำลังลบ…");
    const keep = [];
    let nItem = 0, nShop = 0;
    for (const sh of shops) {
      const names = seedNameSet(sh.id);
      const d = await getDoc("stockItems/" + sh.id);
      const all = (d && d.items) || [];
      const mine = all.filter(x => !(x.seed === true || (names && names.has(x.name))));
      if (all.length !== mine.length) {
        nItem += all.length - mine.length;
        await txDoc("stockItems/" + sh.id, cur => ({ ...cur, items: mine }));
      }
      if (isSeedShop(sh) && !mine.length) {
        nShop++;
        await setDoc("stockPhotos/" + sh.id, { p:{} });
        await clearRecords(sh.id);
      } else keep.push(sh);
    }
    if (keep.length !== shops.length) await saveShops(keep);
    setShopId(keep.some(x => x.id === shopId) ? shopId : (keep.length ? keep[0].id : ""));
    writeUndo(shopId, []);
    if (!nItem && !nShop) alert("ไม่พบข้อมูลตัวอย่างในระบบ\n\nถ้าอยากล้างร้านนี้ทั้งหมด ให้ใช้ปุ่ม 🗑 ล้างข้อมูลร้านนี้ ด้านล่าง");
    else say(`ลบแล้ว ${nShop} ร้าน · ${nItem} รายการ ✓`);
  };

  const wipeShop = async () => {
    if (!shop) return;
    if (!confirm(`ล้างข้อมูลร้าน ${shop.name} ทั้งหมด\n\n· รายการของ ${items.length} รายการ\n· ประวัติการนับและใบสั่งของ\n· รูปทั้งหมด\n\nลบถาวร กู้คืนไม่ได้ ยืนยัน?`)) return;
    if (prompt('พิมพ์คำว่า  ลบ  เพื่อยืนยัน') !== "ลบ") { say("ยกเลิกแล้ว"); return; }
    say("กำลังล้าง…");
    await txDoc("stockItems/" + shop.id, cur => ({ ...cur, items: [] }));
    await setDoc("stockPhotos/" + shop.id, { p:{} });
    await clearRecords(shop.id);
    setItems([]); setCounts({}); setOrders({}); setOrderDraft({});
    writeUndo(shop.id, []);
    say("ล้างข้อมูลร้านนี้แล้ว ✓");
  };

  const exportJson = () => {
    const blob = new Blob([JSON.stringify({ shop:shopId, cats, units, items }, null, 1)], { type:"application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = `stock-${shopId}-${today()}.json`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  };
  const importJson = file => {
    const fr = new FileReader();
    fr.onload = async () => {
      try {
        const d = JSON.parse(fr.result);
        if (!Array.isArray(d.items)) throw new Error("ไฟล์ไม่ถูกต้อง");
        if (!confirm(`นำเข้า ${d.items.length} รายการ ทับข้อมูลร้านนี้?`)) return;
        setItems(d.items);
        await txDoc("stockItems/" + shopId, cur => ({ ...cur, items:d.items, cats:d.cats || cats, units:d.units || units }));
        say("นำเข้าแล้ว ✓");
      } catch (e) { alert("นำเข้าไม่สำเร็จ: " + e.message); }
    };
    fr.readAsText(file);
  };

  /* ---- ยอดล่าสุดจากการนับ ---- */
  const latest = useMemo(() => {
    const all = Object.values(counts).flat().sort((a, b) => (b.ts || 0) - (a.ts || 0));
    const map = {};
    all.forEach(c => (c.lines || []).forEach(l => {
      if (map[l.itemId] === undefined) map[l.itemId] = { qty:Number(l.qty), date:c.date };
    }));
    return { map, last: all[0] || null, all };
  }, [counts]);

  const lowItems = useMemo(() => items.filter(i => {
    const q = latest.map[i.id];
    return Number(i.min) > 0 && q !== undefined && q.qty <= Number(i.min);
  }), [items, latest]);

  const neverCounted = useMemo(() => items.filter(i => latest.map[i.id] === undefined), [items, latest]);

  const addToOrder = (id, qty) => {
    setOrderDraft(p => ({ ...p, [id]: qty !== undefined ? qty : (p[id] || 0) + 1 }));
    say("ใส่ในรายการสั่งของแล้ว");
  };

  if (booting) return <div className="empty" style={{ paddingTop:120 }}>กำลังโหลด…</div>;

  const TABS = [
    { k:"stock",  ic:"📦", t:"รายการของ" },
    { k:"count",  ic:"📋", t:"นับสต๊อก" },
    { k:"order",  ic:"🛒", t:"สั่งของ" },
    { k:"hist",   ic:"🕘", t:"ประวัติ" },
    { k:"setup",  ic:"⚙️", t:"ตั้งค่า" },
  ];

  return (
    <div style={{ paddingBottom:80 }}>
      <Header shop={shop} shops={shops} setShopId={setShopId} isOwner={isOwner} onRole={askOwner}
        onHelp={() => setSheet({ type:"help" })} onUndo={undoLast} undoCount={undoStack.length}
        items={items.length} low={lowItems.length} lastDate={latest.last ? latest.last.date : null} />

      {!LOCAL_MODE ? (
        <div style={{ display:"flex", justifyContent:"center", marginTop:8 }}>
          <span style={{ fontSize:11.5, color: online ? "var(--green)" : "var(--muted)",

            {online ? "🟢 ออนไลน์ · ซิงก์ทุกเครื่องอัตโนมัติ" : "⚪ กำลังเชื่อมต่อ…"}
          </span>
        </div>
      ) : (
        <div style={{ margin:"10px 16px 0", background:"#FFF3E2", border:"1px solid #F0D9B4",
          borderRadius:14, padding:"9px 13px", fontSize:12.5, lineHeight:1.55 }}>
          🧪 <b>โหมดทดลอง</b> — ข้อมูลเก็บในเครื่องนี้เท่านั้น<br/>
          สาเหตุ: ยังไม่พบไฟล์ <b>firebase-config.js</b> หรือยังไม่ได้ใส่ค่าในไฟล์นั้น
        </div>
      )}

      {loadingShop ? <div className="empty">กำลังโหลด…</div> : null}

      {!shops.length ? (
        <div style={{ padding:16 }}>
          <div className="card" style={{ padding:20, textAlign:"center" }}>
            <img className="emptypic" src="empty-box.jpg" alt="" />
            <div style={{ fontWeight:600, margin:"6px 0 4px" }}>ยังไม่มีร้าน</div>
            <div style={{ color:"var(--muted)", fontSize:13, marginBottom:14 }}>
              เริ่มด้วยชุดตัวอย่าง 5 ร้าน พร้อมรายการของและราคา
            </div>
            <button className="btn gold press" style={{ width:"100%", marginBottom:8 }} onClick={loadSeed}>✨ โหลดข้อมูลตัวอย่าง</button>
            <button className="btn ghost press" style={{ width:"100%" }} onClick={() => setSheet({ type:"shop", data:null })}>➕ เพิ่มร้านเอง</button>
          </div>
        </div>
      ) : (
        <>
          {tab === "stock" && <TabStock {...{ items, cats, photos, latest, lowItems, neverCounted, isOwner, setSheet, say }} />}
          {tab === "count" && <TabCount {...{ items, cats, photos, latest, shop, saveCount, say, setTab }} />}
          {tab === "order" && <TabOrder {...{ items, latest, lowItems, orderDraft, setOrderDraft, shop, saveOrder, say }} />}
          {tab === "hist"  && <TabHist  {...{ counts, orders, items, shop, loadMonth, delRecord, isOwner, say }} />}
          {tab === "setup" && <TabSetup {...{ shops, shop, saveShops, setShopId, cats, units, items, photos, savePhoto, saveMeta, isOwner, cfg, setCfg, setSheet, say, loadSeed, cleanupSeed, wipeShop, exportJson, importJson }} />}
        </>
      )}

      <div className="nav">
        {TABS.map(x => (
          <button key={x.k} className={tab === x.k ? "on" : ""} onClick={() => setTab(x.k)}>
            <span className="ic" style={{ position:"relative" }}>

      {sheet && sheet.type === "item" &&
        <ItemSheet item={sheet.data} cats={cats} units={units} items={items} isOwner={isOwner}
          photo={sheet.data ? photos[sheet.data.id] : null} onClose={() => setSheet(null)}
          onSave={async (it, img) => {
            await upsertItem(it, (items.some(x => x.id === it.id) ? "แก้ไข " : "เพิ่ม ") + it.name);
            if (img !== undefined) await savePhoto(it.id, img);
            setSheet(null); say("บันทึกแล้ว ✓");
          }}
          onDelete={async it => {
            if (!confirm("ลบ " + it.name + " ?")) return;
            await removeItem(it.id, "ลบ " + it.name);
            await savePhoto(it.id, null);
            setSheet(null); say("ลบแล้ว");
          }} />}

      {sheet && sheet.type === "view" &&
        <ItemView item={sheet.data} photo={photos[sheet.data.id]} latest={latest.map[sheet.data.id]}
          isOwner={isOwner} onClose={() => setSheet(null)}
          onEdit={() => setSheet({ type:"item", data:sheet.data })}
          onOrder={() => { addToOrder(sheet.data.id); setSheet(null); }} />}

      {sheet && sheet.type === "shop" &&
        <ShopSheet shop={sheet.data} shops={shops} onClose={() => setSheet(null)}
          onSave={async sh => {
            const exists = shops.some(x => x.id === sh.id);
            await saveShops(exists ? shops.map(x => x.id === sh.id ? sh : x) : [...shops, sh]);
            if (!exists) setShopId(sh.id);
            setSheet(null); say("บันทึกแล้ว ✓");
          }}
          onDelete={async sh => {
            if (!confirm("ลบร้าน " + sh.name + " ?")) return;
            const next = shops.filter(x => x.id !== sh.id);
            await saveShops(next); setShopId(next.length ? next[0].id : ""); setSheet(null);

            maxWidth:"85%", textAlign:"center" }}>{toast}</div>
        </div>
      ) : null}
    </div>
  );
}

/* ---------- TAB 1: รายการของ ---------- */
function TabStock({ items, cats, photos, latest, lowItems, neverCounted, isOwner, setSheet, say }) {
  const [q, setQ] = useState("");
  const [cat, setCat] = useState("*");
  const [onlyLow, setOnlyLow] = useState(false);

  const list = useMemo(() => {
    let r = items.slice();
    if (cat !== "*") r = r.filter(i => i.cat === cat);
    if (onlyLow) r = r.filter(i => lowItems.some(x => x.id === i.id));
    if (q.trim()) {
      const s = q.trim().toLowerCase();
      r = r.filter(i => [i.name, i.brand, i.detail, i.vendor].join(" ").toLowerCase().includes(s));
    }
    return r.sort((a, b) => (a.cat || "").localeCompare(b.cat || "", "th") || (a.name || "").localeCompare(b.name || "", "th"));
  }, [items, q, cat, onlyLow, lowItems]);

  return (
    <div>
      <div style={{ padding:"14px 16px 6px" }}>
        <input placeholder="🔍 ค้นหา ชื่อ / ยี่ห้อ / ร้านที่ซื้อ" value={q} onChange={e => setQ(e.target.value)} />
      </div>
      <div className="scroll-x">
        <button className={"chip press " + (cat === "*" && !onlyLow ? "on" : "")}
          onClick={() => { setCat("*"); setOnlyLow(false); }}>ทั้งหมด {items.length}</button>
        <button className={"chip press " + (onlyLow ? "on" : "")} onClick={() => { setOnlyLow(!onlyLow); setCat("*"); }}
          style={ onlyLow ? { background:"var(--red)", borderColor:"var(--red)" } : {}}>🔴 ต้องสั่ง {lowItems.length}</button>
        {cats.map(c => (
          <button key={c} className={"chip press " + (cat === c ? "on" : "")}
            onClick={() => { setCat(c); setOnlyLow(false); }}>{c}</button>
        ))}
      </div>

      {neverCounted.length ? (
        <div style={{ margin:"2px 16px 10px", background:"#FFF3E2", border:"1px solid #F0D9B4",
          borderRadius:14, padding:"9px 13px", fontSize:12.5 }}>
          ยังไม่เคยนับ {neverCounted.length} รายการ — ไปแท็บ 📋 นับสต๊อก เพื่อบันทึกยอดครั้งแรก
        </div>
      ) : null}

      <div style={{ padding:"0 16px 10px" }}>
        <button className="btn press" style={{ width:"100%" }} onClick={() => setSheet({ type:"item", data:null })}>➕ เพิ่มรายการใหม่</button>
      </div>

      {!list.length ? (
        <div className="empty">
          <img className="emptypic" src="empty-box.jpg" alt="" />
          {items.length ? "ไม่พบรายการที่ค้นหา" : "ยังไม่มีของในคลัง กด ➕ เพิ่มรายการใหม่"}
        </div>
      ) : null}

      <div style={{ padding:"0 16px", display:"grid", gap:8 }}>
        {list.map(it => {
          const l = latest.map[it.id];
          const low = lowItems.some(x => x.id === it.id);
          const trend = priceTrend(it);
          return (
            <div key={it.id} className="card press" onClick={() => setSheet({ type:"view", data:it })}
              style={{ padding:11, display:"flex", gap:11, alignItems:"center", borderColor: low ? "#EFC3C9" : "var(--line)" }}>
              {photos[it.id] ? <img className="thumb" src={photos[it.id]} alt="" /> : <div className="thumb">📦</div>}
              <div style={{ flex:1, minWidth:0 }}>
                <div style={{ fontWeight:500, fontSize:14.5, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>
                  {it.name}
                </div>
                <div style={{ fontSize:11.5, color:"var(--muted)", marginTop:2, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>
                  {[it.brand, it.vendor].filter(Boolean).join(" · ") || it.cat}
                </div>
                <div style={{ fontSize:12, marginTop:3 }}>
                  <b style={{ color:"var(--head)" }}>{money(it.price)}</b>
                  <span style={{ color:"var(--muted)" }}>/{it.unit}</span>
                  {trend ? <span style={{ color: trend.up ? "var(--red)" : "var(--green)", marginLeft:6 }}>
                    {trend.up ? "▲" : "▼"} {nf(Math.abs(trend.diff))}
                  </span> : null}
                </div>
              </div>
              <div style={{ textAlign:"right", flex:"none" }}>
                <div style={{ fontSize:20, fontWeight:600, color: low ? "var(--red)" : "var(--head)" }}>
                  {l ? nf(l.qty) : "—"}
                </div>
                <div style={{ fontSize:10.5, color:"var(--muted)" }}>{it.unit}</div>
                {Number(it.min) > 0 ? <div style={{ fontSize:10, color:"var(--muted)" }}>ขั้นต่ำ {nf(it.min)}</div> : null}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function priceTrend(it) {
  const ph = (it.ph || []).slice().sort((a, b) => (b.ts || 0) - (a.ts || 0));
  if (!ph.length) return null;
  const prev = ph.find(x => Number(x.price) !== Number(it.price));
  if (!prev) return null;
  const diff = Number(it.price) - Number(prev.price);
  if (!diff) return null;
  return { up: diff > 0, diff, from: prev };
}

      <div className="row" style={{ gap:8 }}>

/* ---------- เพิ่ม/แก้ไขรายการ ---------- */
function ItemSheet({ item, cats, units, isOwner, photo, onClose, onSave, onDelete }) {
  const [f, setF] = useState(() => item ? { ...item } : {
    id:uid(), name:"", brand:"", detail:"", cat:cats[0] || "", unit:units[0] || "ชิ้น",
    price:0, min:0, vendor:"", ph:[]
  });
  const [img, setImg] = useState(photo || null);
  const [dirty, setDirty] = useState(false);
  const fileRef = useRef(null);
  const set = (k, v) => setF(p => ({ ...p, [k]: v }));

  const pick = async e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setImg(await compressImg(file, 400, 0.6)); setDirty(true);
  };

  const submit = () => {
    if (!f.name.trim()) { alert("ใส่ชื่อของก่อน"); return; }
    const next = { ...f, name:f.name.trim(), brand:(f.brand||"").trim(), detail:(f.detail||"").trim(),
      vendor:(f.vendor||"").trim(), price:Number(f.price)||0, min:Number(f.min)||0 };
    const changed = !item || Number(item.price) !== next.price || (item.vendor||"") !== next.vendor || (item.brand||"") !== next.brand;
    if (changed) {
      next.ph = [{ ts:Date.now(), date:today(), price:next.price, vendor:next.vendor, brand:next.brand },
                 ...(f.ph || [])].slice(0, 20);
    }
    onSave(next, dirty ? img : undefined);
  };

  return (
    <Sheet title={item ? "แก้ไขรายการ" : "เพิ่มรายการใหม่"} onClose={onClose}>
      <div className="row" style={{ marginBottom:14 }}>
        <div className="press" onClick={() => fileRef.current && fileRef.current.click()}
          style={{ width:78, height:78, borderRadius:16, background:"var(--soft)", display:"flex",
            alignItems:"center", justifyContent:"center", overflow:"hidden", fontSize:26, flex:"none" }}>
          {img ? <img src={img} alt="" style={{ width:"100%", height:"100%", objectFit:"cover" }} /> : "📷"}

        <div style={{ flex:1 }}>
          <div style={{ fontSize:12.5, color:"var(--muted)" }}>แตะเพื่อใส่รูปสินค้า</div>
          {img ? <button className="chip press" style={{ marginTop:6, color:"var(--red)" }}
            onClick={() => { setImg(null); setDirty(true); }}>ลบรูป</button> : null}
        </div>
        <input ref={fileRef} type="file" accept="image/*" onChange={pick} style={{ display:"none" }} />
      </div>

      <Field label="ชื่อของ *"><input value={f.name} onChange={e => set("name", e.target.value)} placeholder="เช่น น้ำยาซักผ้า 20 ลิตร" /></Field>
      <Field label="ยี่ห้อ" hint="ไม่บังคับ"><input value={f.brand} onChange={e => set("brand", e.target.value)} placeholder="เช่น Kao" /></Field>
      <Field label="รายละเอียด / รุ่น" hint="ไม่บังคับ">
        <textarea rows="2" value={f.detail} onChange={e => set("detail", e.target.value)} placeholder="เช่น สูตรเข้มข้น กลิ่นซากุระ" />
      </Field>
      <div className="row" style={{ gap:8 }}>
        <div style={{ flex:1 }}><Field label="หมวด">
          <select value={f.cat} onChange={e => set("cat", e.target.value)}>{cats.map(c => <option key={c} value={c}>{c}</option>)}</select>
        </Field></div>
        <div style={{ flex:1 }}><Field label="หน่วยนับ">
          <select value={f.unit} onChange={e => set("unit", e.target.value)}>{units.map(u => <option key={u} value={u}>{u}</option>)}</select>
        </Field></div>
      </div>
      <Field label="ซื้อจากที่ไหน" hint="ไม่บังคับ"><input value={f.vendor} onChange={e => set("vendor", e.target.value)} placeholder="เช่น แม็คโคร / ร้านเคมีภัณฑ์" /></Field>
      <div className="row" style={{ gap:8 }}>
        <div style={{ flex:1 }}><Field label="ราคาต่อหน่วย (บาท)">
          <input type="number" inputMode="decimal" value={f.price} onChange={e => set("price", e.target.value)} /></Field></div>
        <div style={{ flex:1 }}><Field label="ขั้นต่ำที่ควรมี">
          <input type="number" inputMode="decimal" value={f.min} onChange={e => set("min", e.target.value)} /></Field></div>
      </div>
      <div style={{ fontSize:11.5, color:"var(--muted)", marginBottom:14, lineHeight:1.6 }}>
        💡 เปลี่ยนราคา ยี่ห้อ หรือร้านที่ซื้อ ระบบจะเก็บเป็นประวัติให้อัตโนมัติ ไว้เทียบว่าขึ้นหรือลง
      </div>

      <div className="row" style={{ gap:8 }}>
        {item && isOwner ? <button className="btn danger press" onClick={() => onDelete(item)}>ลบ</button> : null}
        <button className="btn press" style={{ flex:1 }} onClick={submit}>บันทึก</button>
      </div>
    </Sheet>
  );
}

/* ---------- TAB 2: นับสต๊อก ---------- */
function TabCount({ items, cats, photos, latest, shop, saveCount, say, setTab }) {
  const [vals, setVals] = useState({});
  const [by, setBy] = useState(LS.get("ps_by") || "");
  const [date, setDate] = useState(today());
  const [note, setNote] = useState("");
  const [cat, setCat] = useState("*");
  const [done, setDone] = useState(null);

  const list = useMemo(() => {
    let r = items.slice();
    if (cat !== "*") r = r.filter(i => i.cat === cat);
    return r.sort((a, b) => (a.cat || "").localeCompare(b.cat || "", "th") || (a.name || "").localeCompare(b.name || "", "th"));
  }, [items, cat]);

  const filled = items.filter(i => vals[i.id] !== undefined && vals[i.id] !== "").length;

  const submit = async () => {
    const lines = items.filter(i => vals[i.id] !== undefined && vals[i.id] !== "")
      .map(i => ({ itemId:i.id, qty:Number(vals[i.id]) }));
    if (!lines.length) { say("ยังไม่ได้กรอกยอดเลย"); return; }
    if (!confirm(`บันทึกการนับ ${lines.length} รายการ วันที่ ${thDate(date)} ?`)) return;
    LS.set("ps_by", by);
    const session = { id:uid(), ts:Date.now(), date, by:by.trim(), note:note.trim(), lines };
    await saveCount(session);
    setDone(session); setVals({}); setNote("");
  };

  if (done) return <CountDone session={done} items={items} shop={shop} say={say}
    onNew={() => setDone(null)} onGoOrder={() => { setDone(null); setTab("order"); }} />;

  return (
    <div style={{ padding:"14px 0 0" }}>
      <div style={{ padding:"0 16px 12px" }}>
        <div className="card" style={{ padding:13 }}>
          <div className="row" style={{ gap:8 }}>
            <div style={{ flex:1 }}><Field label="วันที่นับ"><input type="date" value={date} onChange={e => setDate(e.target.value)} /></Field></div>
            <div style={{ flex:1 }}><Field label="ผู้นับ"><input value={by} onChange={e => setBy(e.target.value)} placeholder="ชื่อ" /></Field></div>
          </div>
          <Field label="หมายเหตุ" hint="ไม่บังคับ"><input value={note} onChange={e => setNote(e.target.value)} placeholder="เช่น นับหลังปิดร้าน" /></Field>
          <div style={{ fontSize:13, color:"var(--muted)" }}>
            กรอกแล้ว <b style={{ color:"var(--head)" }}>{filled}</b> / {items.length} รายการ · ช่องที่เว้นว่างจะไม่ถูกบันทึก
          </div>
        </div>
      </div>

      <div className="scroll-x">
        <button className={"chip press " + (cat === "*" ? "on" : "")} onClick={() => setCat("*")}>ทั้งหมด</button>
        {cats.map(c => <button key={c} className={"chip press " + (cat === c ? "on" : "")} onClick={() => setCat(c)}>{c}</button>)}
      </div>

      <div style={{ padding:"0 16px", display:"grid", gap:7 }}>
        {list.map(i => {
          const v = vals[i.id];
          const has = v !== undefined && v !== "";
          const low = has && Number(i.min) > 0 && Number(v) <= Number(i.min);
          const prev = latest.map[i.id];
          return (
            <div key={i.id} className="card" style={{ padding:"10px 12px", display:"flex", gap:10, alignItems:"center",
              borderColor: low ? "#EFC3C9" : has ? "#CFE3D6" : "var(--line)" }}>
              {photos[i.id] ? <img className="thumb" style={{ width:38, height:38 }} src={photos[i.id]} alt="" />
                            : <div className="thumb" style={{ width:38, height:38, fontSize:16 }}>📦</div>}
              <div style={{ flex:1, minWidth:0 }}>
                <div style={{ fontSize:14, fontWeight:500, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{i.name}</div>
                <div style={{ fontSize:11, color:"var(--muted)" }}>
                  {prev ? `ครั้งก่อน ${nf(prev.qty)}` : "ยังไม่เคยนับ"}{Number(i.min) > 0 ? ` · ขั้นต่ำ ${nf(i.min)}` : ""}
                </div>
              </div>
              {low ? <span className="tag" style={{ background:"#FBE5E8", color:"var(--red)" }}>ต้องสั่ง</span> : null}
              <input type="number" inputMode="decimal" placeholder={i.unit} value={v === undefined ? "" : v}
                onChange={e => setVals(p => ({ ...p, [i.id]: e.target.value }))}
                style={{ width:88, textAlign:"center", fontWeight:600 }} />
            </div>
          );
        })}
      </div>

      <div style={{ padding:"14px 16px 0" }}>
        <button className="btn gold press" style={{ width:"100%" }} onClick={submit}>
          ✅ บันทึกผลนับ {filled ? `(${filled} รายการ)` : ""}
        </button>
      </div>
    </div>
  );
}

function countGroups(session, items) {
  const byCat = {};
  (session.lines || []).forEach(l => {
    const it = items.find(x => x.id === l.itemId);
    if (!it) return;
    const c = it.cat || "อื่นๆ";
    (byCat[c] = byCat[c] || []).push({
      left: it.name + (it.brand ? ` (${it.brand})` : ""),
      right: `${nf(l.qty)} ${it.unit}`,
      flag: Number(it.min) > 0 && Number(l.qty) <= Number(it.min) ? "🔴" : ""
    });
  });
  return Object.entries(byCat).map(([title, lines]) => ({ title, lines }));
}

function CountDone({ session, items, shop, say, onNew, onGoOrder }) {
  const groups = countGroups(session, items);
  const lowN = groups.reduce((s, g) => s + g.lines.filter(l => l.flag).length, 0);
  const head = `${thDate(session.date)}${session.by ? " · ผู้นับ: " + session.by : ""}${session.note ? " · " + session.note : ""}`;
  const footer = `รวม ${(session.lines || []).length} รายการ · ต้องสั่ง ${lowN} รายการ`;

  return (
    <div style={{ padding:"16px" }}>
      <div className="card" style={{ padding:20, textAlign:"center", marginBottom:14 }}>
        <div style={{ fontSize:44 }}>✅</div>
        <div style={{ fontWeight:600, fontSize:17, margin:"6px 0 3px" }}>บันทึกการนับแล้ว</div>
        <div style={{ color:"var(--muted)", fontSize:13 }}>{head}</div>
        <div style={{ marginTop:10, fontSize:14 }}>
          {(session.lines || []).length} รายการ · <b style={{ color: lowN ? "var(--red)" : "var(--green)" }}>ต้องสั่ง {lowN}</b>
        </div>
      </div>

      <div style={{ display:"grid", gap:8, marginBottom:14 }}>
        <button className="btn press" onClick={() => copyText(
          buildText("📋 นับสต๊อก", shop ? shop.name : "", head, groups, footer), say)}>
          📋 คัดลอกเป็นข้อความ
        </button>
        <button className="btn gold press" onClick={() => shareCanvas(
          renderImage({ title:"นับสต๊อก · " + (shop ? shop.name : ""), head, groups, footer,
            color: colorOf(shop && shop.color).head }),
          `count-${session.date}.png`, say)}>
          🖼 ส่งเป็นรูปภาพ
        </button>
        <button className="btn ghost press" onClick={onGoOrder}>🛒 ไปหน้าสั่งของ</button>
        <button className="btn ghost press" onClick={onNew}>เริ่มนับรอบใหม่</button>
      </div>

      <div className="card" style={{ padding:"6px 14px" }}>
        {groups.map(g => (
          <div key={g.title}>
            <div style={{ fontWeight:600, fontSize:13, color:"var(--muted)", padding:"12px 0 2px" }}>{g.title}</div>
            {g.lines.map((l, i) => (
              <div key={i} className="kv">
                <span style={{ fontSize:13.5 }}>{l.left} {l.flag}</span>
                <b>{l.right}</b>
              </div>
            ))}
          </div>
        ))}
      </div>
    </div>
  );
}

/* ---------- TAB 3: สั่งของ ---------- */
function TabOrder({ items, latest, lowItems, orderDraft, setOrderDraft, shop, saveOrder, say }) {
  const [by, setBy] = useState(LS.get("ps_by") || "");
  const [note, setNote] = useState("");
  const [pick, setPick] = useState(false);
  const [q, setQ] = useState("");

  useEffect(() => {
    if (Object.keys(orderDraft).length) return;
    const d = {};
    lowItems.forEach(i => {
      const cur = latest.map[i.id] ? Number(latest.map[i.id].qty) : 0;
      d[i.id] = Math.max(Math.ceil(Number(i.min) * 2 - cur), 1);
    });
    if (Object.keys(d).length) setOrderDraft(d);
  }, [lowItems]);

  const chosen = items.filter(i => Number(orderDraft[i.id]) > 0);
  const total = chosen.reduce((s, i) => s + Number(orderDraft[i.id]) * (Number(i.price) || 0), 0);

  const groups = useMemo(() => {
    const byVendor = {};
    chosen.forEach(i => {
      const v = i.vendor || "ไม่ระบุร้าน";
      (byVendor[v] = byVendor[v] || []).push({
        left: i.name + (i.brand ? ` (${i.brand})` : ""),
        right: `${nf(orderDraft[i.id])} ${i.unit}`,
        sub: money(Number(orderDraft[i.id]) * (Number(i.price) || 0))
      });
    });
    return Object.entries(byVendor).map(([title, lines]) => ({ title, lines }));
  }, [chosen, orderDraft]);

  const head = `${thDate(today())}${by ? " · สั่งโดย: " + by : ""}${note ? " · " + note : ""}`;
  const footer = `รวม ${chosen.length} รายการ · ประมาณ ${money(total)}`;

  const searchList = useMemo(() => {
    const s = q.trim().toLowerCase();
    return items.filter(i => !s || [i.name, i.brand, i.vendor].join(" ").toLowerCase().includes(s))
      .sort((a, b) => (a.name || "").localeCompare(b.name || "", "th")).slice(0, 40);
  }, [items, q]);

  const save = async () => {
    if (!chosen.length) { say("ยังไม่ได้เลือกของ"); return; }
    LS.set("ps_by", by);
    await saveOrder({ id:uid(), ts:Date.now(), date:today(), by:by.trim(), note:note.trim(), total,
      lines: chosen.map(i => ({ itemId:i.id, qty:Number(orderDraft[i.id]), price:Number(i.price) || 0, vendor:i.vendor || "" })) });
    say("บันทึกใบสั่งของแล้ว ✓");
  };

  return (
    <div style={{ padding:"14px 16px" }}>
      <div className="card" style={{ padding:13, marginBottom:12 }}>
        <div className="row" style={{ gap:8 }}>
          <div style={{ flex:1 }}><Field label="ผู้สั่ง"><input value={by} onChange={e => setBy(e.target.value)} placeholder="ชื่อ" /></Field></div>
          <div style={{ flex:1.3 }}><Field label="หมายเหตุ"><input value={note} onChange={e => setNote(e.target.value)} placeholder="เช่น ซื้อพรุ่งนี้เช้า" /></Field></div>
        </div>
        <div style={{ display:"flex", gap:8 }}>
          <Stat label="เลือกแล้ว" value={chosen.length} sub="รายการ" />
          <Stat label="ราคาประมาณ" value={money(total)} color="var(--gold)" />
        </div>
      </div>

      <div style={{ display:"flex", gap:8, marginBottom:12 }}>
        <button className="btn ghost press" style={{ flex:1 }} onClick={() => setPick(!pick)}>
          {pick ? "✕ ปิดรายการ" : "➕ เพิ่มของเอง"}
        </button>
        <button className="btn ghost press" onClick={() => setOrderDraft({})}>ล้าง</button>
      </div>

      {pick ? (
        <div className="card" style={{ padding:12, marginBottom:12 }}>
          <input placeholder="🔍 ค้นหาของที่จะสั่ง" value={q} onChange={e => setQ(e.target.value)} style={{ marginBottom:10 }} />
          <div style={{ maxHeight:280, overflow:"auto", display:"grid", gap:6 }}>
            {searchList.map(i => {
              const on = Number(orderDraft[i.id]) > 0;
              return (
                <button key={i.id} className="press" onClick={() => setOrderDraft(p => {
                  const n = { ...p }; if (on) delete n[i.id]; else n[i.id] = 1; return n;
                })} style={{ textAlign:"left", padding:"9px 11px", borderRadius:12,
                  border:"1px solid " + (on ? "var(--head)" : "var(--line)"), background: on ? "var(--soft)" : "#fff",
                  display:"flex", gap:8, alignItems:"center" }}>
                  <span style={{ flex:1, fontSize:13.5 }}>{i.name}
                    <span style={{ color:"var(--muted)", fontSize:11.5 }}>{i.vendor ? " · " + i.vendor : ""}</span>
                  </span>
                  <span style={{ fontSize:12, color:"var(--muted)" }}>{money(i.price)}</span>
                  <span>{on ? "✓" : "＋"}</span>
                </button>
              );
            })}
          </div>
        </div>
      ) : null}

      {!chosen.length ? (
        <div className="empty">
          <img className="emptypic" src="empty-box.jpg" alt="" />
          ยังไม่มีของในรายการสั่ง<br/>ระบบจะใส่ของที่ต่ำกว่าขั้นต่ำให้อัตโนมัติหลังนับสต๊อก
        </div>
      ) : null}

      {groups.map(g => (
        <div key={g.title} style={{ marginBottom:12 }}>
          <div className="sect" style={{ margin:"4px 2px 6px" }}>🏬 {g.title}</div>
          <div className="card" style={{ padding:"4px 12px" }}>
            {chosen.filter(i => (i.vendor || "ไม่ระบุร้าน") === g.title).map(i => (
              <div key={i.id} style={{ display:"flex", gap:8, alignItems:"center", padding:"9px 0",
                borderBottom:"1px solid var(--line)" }}>
                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{ fontSize:14, fontWeight:500 }}>{i.name}</div>
                  <div style={{ fontSize:11.5, color:"var(--muted)" }}>
                    {money(i.price)}/{i.unit}
                    {latest.map[i.id] ? ` · เหลือ ${nf(latest.map[i.id].qty)}` : ""}
                  </div>
                </div>
                <button className="press" onClick={() => setOrderDraft(p => ({ ...p, [i.id]: Math.max(0, Number(p[i.id] || 0) - 1) }))}
                  style={{ width:34, height:34, borderRadius:10, background:"var(--soft)" }}>−</button>
                <input type="number" inputMode="decimal" value={orderDraft[i.id]}
                  onChange={e => setOrderDraft(p => ({ ...p, [i.id]: e.target.value }))}
                  style={{ width:60, textAlign:"center", fontWeight:600, padding:"7px 4px" }} />
                <button className="press" onClick={() => setOrderDraft(p => ({ ...p, [i.id]: Number(p[i.id] || 0) + 1 }))}
                  style={{ width:34, height:34, borderRadius:10, background:"var(--soft)" }}>＋</button>
              </div>
            ))}
          </div>
        </div>
      ))}

      {chosen.length ? (
        <div style={{ display:"grid", gap:8, marginTop:6 }}>
          <button className="btn press" onClick={() => copyText(
            buildText("🛒 รายการสั่งซื้อ", shop ? shop.name : "", head, groups, footer), say)}>
            📋 คัดลอกเป็นข้อความ
          </button>
          <button className="btn gold press" onClick={() => shareCanvas(
            renderImage({ title:"รายการสั่งซื้อ · " + (shop ? shop.name : ""), head, groups, footer,
              color: colorOf(shop && shop.color).head }), `order-${today()}.png`, say)}>
            🖼 ส่งเป็นรูปภาพ
          </button>
          <button className="btn ghost press" onClick={save}>💾 บันทึกใบสั่งของ</button>
        </div>
      ) : null}
    </div>
  );
}

/* ---------- TAB 4: ประวัติ ---------- */
function TabHist({ counts, orders, items, shop, loadMonth, delRecord, isOwner, say }) {
  const [kind, setKind] = useState("count");
  const [mk, setMk] = useState(monthOf(today()));
  const [openId, setOpenId] = useState("");

  useEffect(() => { loadMonth(kind, mk); }, [kind, mk]);

  const list = ((kind === "count" ? counts : orders)[mk] || []).slice().sort((a, b) => (b.ts || 0) - (a.ts || 0));

  return (
    <div style={{ padding:"14px 16px" }}>
      <div style={{ display:"flex", gap:8, marginBottom:12 }}>
        <button className={"chip press " + (kind === "count" ? "on" : "")} style={{ flex:1, padding:"9px 0", textAlign:"center" }}
          onClick={() => setKind("count")}>📋 การนับ</button>
        <button className={"chip press " + (kind === "order" ? "on" : "")} style={{ flex:1, padding:"9px 0", textAlign:"center" }}
          onClick={() => setKind("order")}>🛒 ใบสั่งของ</button>
      </div>
      <select value={mk} onChange={e => setMk(e.target.value)} style={{ marginBottom:12 }}>
        {lastMonths(18).map(m => <option key={m} value={m}>{THMON[+m.slice(5)-1]} {+m.slice(0,4)+543}</option>)}
      </select>

      {!list.length ? <div className="empty">ไม่มีข้อมูลเดือนนี้</div> : null}

      <div style={{ display:"grid", gap:8 }}>
        {list.map(r => {
          const open = openId === r.id;
          const groups = kind === "count" ? countGroups(r, items) : orderGroups(r, items);
          const head = `${thDate(r.date)}${r.by ? " · " + r.by : ""}${r.note ? " · " + r.note : ""}`;
          const footer = kind === "count"
            ? `รวม ${(r.lines || []).length} รายการ`
            : `รวม ${(r.lines || []).length} รายการ · ประมาณ ${money(r.total)}`;
          return (
            <div key={r.id} className="card" style={{ overflow:"hidden" }}>
              <button className="press" onClick={() => setOpenId(open ? "" : r.id)}
                style={{ width:"100%", textAlign:"left", padding:"12px 14px", display:"flex", gap:10, alignItems:"center" }}>
                <div className="thumb" style={{ width:40, height:40, fontSize:17, background:"var(--soft)" }}>
                  {kind === "count" ? "📋" : "🛒"}
                </div>
                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{ fontWeight:500, fontSize:14.5 }}>{thDate(r.date)}</div>
                  <div style={{ fontSize:11.5, color:"var(--muted)" }}>
                    {(r.lines || []).length} รายการ{r.by ? " · " + r.by : ""}{kind === "order" ? " · " + money(r.total) : ""}
                  </div>
                </div>
                <span style={{ color:"var(--muted)", fontSize:12 }}>{open ? "▲" : "▼"}</span>
              </button>
              {open ? (
                <div style={{ padding:"0 14px 14px", borderTop:"1px solid var(--line)" }}>
                  {r.note ? <div style={{ fontSize:12.5, color:"var(--muted)", padding:"10px 0 0" }}>📝 {r.note}</div> : null}
                  {groups.map(g => (
                    <div key={g.title}>
                      <div style={{ fontWeight:600, fontSize:12.5, color:"var(--muted)", padding:"12px 0 2px" }}>{g.title}</div>
                      {g.lines.map((l, i) => (
                        <div key={i} className="kv"><span style={{ fontSize:13.5 }}>{l.left} {l.flag || ""}</span><b>{l.right}</b></div>
                      ))}
                    </div>
                  ))}
                  <div style={{ display:"grid", gap:8, marginTop:12 }}>
                    <button className="btn ghost press" onClick={() => copyText(
                      buildText(kind === "count" ? "📋 นับสต๊อก" : "🛒 รายการสั่งซื้อ", shop ? shop.name : "", head, groups, footer), say)}>
                      📋 คัดลอกข้อความ
                    </button>
                    <button className="btn ghost press" onClick={() => shareCanvas(
                      renderImage({ title:(kind === "count" ? "นับสต๊อก · " : "รายการสั่งซื้อ · ") + (shop ? shop.name : ""),
                        head, groups, footer, color: colorOf(shop && shop.color).head }),
                      `${kind}-${r.date}.png`, say)}>
                      🖼 ส่งเป็นรูปภาพ
                    </button>
                    {isOwner ? (
                      <button className="btn danger press" onClick={() => {
                        if (confirm("ลบรายการนี้ถาวร?")) delRecord(kind, mk, r.id);
                      }}>🗑 ลบรายการนี้</button>
                    ) : null}
                  </div>
                </div>
              ) : null}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function orderGroups(order, items) {
  const byVendor = {};
  (order.lines || []).forEach(l => {
    const it = items.find(x => x.id === l.itemId);
    const name = it ? it.name + (it.brand ? ` (${it.brand})` : "") : "(ลบแล้ว)";
    const v = l.vendor || (it && it.vendor) || "ไม่ระบุร้าน";
    (byVendor[v] = byVendor[v] || []).push({ left:name, right:`${nf(l.qty)} ${it ? it.unit : ""}` });
  });
  return Object.entries(byVendor).map(([title, lines]) => ({ title, lines }));
}

/* ---------- TAB 5: ตั้งค่า ---------- */
function TabSetup({ shops, shop, saveShops, setShopId, cats, units, items, photos, savePhoto, saveMeta,
                    isOwner, cfg, setCfg, setSheet, say, loadSeed, cleanupSeed, wipeShop, exportJson, importJson }) {
  const [newCat, setNewCat] = useState("");
  const [newUnit, setNewUnit] = useState("");
  const [pin, setPin] = useState(cfg.ownerPin);
  const impRef = useRef(null);
  const catRef = useRef(null);
  const [catTarget, setCatTarget] = useState("");

  if (!isOwner) return (
    <div className="empty" style={{ paddingTop:60 }}>
      🔒 หน้านี้สำหรับเจ้าของ<br />กดปุ่ม 👤 มุมขวาบนเพื่อใส่ PIN
    </div>
  );

  const pickCatImg = async e => {
    const file = e.target.files && e.target.files[0];
    if (!file || !catTarget) return;
    await savePhoto("cat:" + catTarget, await compressImg(file, 300, 0.6));
    say("ใส่รูปหมวดแล้ว ✓");
  };

  return (
    <div style={{ padding:"14px 16px" }}>
      <div className="card" style={{ padding:14, marginBottom:14 }}>
        <div className="row" style={{ marginBottom:10 }}>
          <div style={{ fontWeight:600, flex:1 }}>🏪 ร้าน</div>
          <button className="btn press" style={{ padding:"7px 13px", fontSize:13 }}
            onClick={() => setSheet({ type:"shop", data:null })}>➕ เพิ่ม</button>
        </div>
        {shops.map(s => (
          <div key={s.id} className="kv">
            <span className="row">
              <span style={{ width:18, height:18, borderRadius:6, background:colorOf(s.color).head, flex:"none" }}></span>
              <span style={{ fontSize:19 }}>{s.emo || "🏪"}</span>
              <span>{s.name}</span>
            </span>
            <button className="chip press" onClick={() => setSheet({ type:"shop", data:s })}>แก้ไข</button>
          </div>
        ))}
      </div>

      <div className="card" style={{ padding:14, marginBottom:14 }}>
        <div style={{ fontWeight:600, marginBottom:4 }}>🗂 หมวดหมู่</div>
        <div style={{ fontSize:11.5, color:"var(--muted)", marginBottom:10 }}>แตะรูปเพื่อใส่ภาพประกอบหมวด</div>
        <div style={{ display:"grid", gap:7, marginBottom:10 }}>
          {cats.map(c => (
            <div key={c} className="row" style={{ gap:9 }}>
              <div className="press" onClick={() => { setCatTarget(c); setTimeout(() => catRef.current && catRef.current.click(), 30); }}
                style={{ width:40, height:40, borderRadius:11, background:"var(--soft)", overflow:"hidden",
                  display:"flex", alignItems:"center", justifyContent:"center", fontSize:16, flex:"none" }}>
                {photos["cat:" + c] ? <img src={photos["cat:" + c]} alt="" style={{ width:"100%", height:"100%", objectFit:"cover" }} /> : "🗂"}
              </div>
              <span style={{ flex:1, fontSize:14 }}>{c}</span>
              {photos["cat:" + c] ? <button className="chip press" onClick={() => savePhoto("cat:" + c, null)}>ลบรูป</button> : null}
              <button className="press" onClick={() => {
                const used = items.filter(i => i.cat === c).length;
                if (used) { say(`ยังมี ${used} รายการใช้หมวดนี้`); return; }
                saveMeta(cats.filter(x => x !== c), null);
              }} style={{ color:"var(--red)", width:30 }}>✕</button>
            </div>
          ))}
        </div>
        <input ref={catRef} type="file" accept="image/*" onChange={pickCatImg} style={{ display:"none" }} />
        <div className="row">
          <input value={newCat} onChange={e => setNewCat(e.target.value)} placeholder="เพิ่มหมวดใหม่" />
          <button className="btn ghost press" onClick={() => {
            const v = newCat.trim(); if (!v || cats.includes(v)) return;
            saveMeta([...cats, v], null); setNewCat("");
          }}>เพิ่ม</button>
        </div>
      </div>

      <div className="card" style={{ padding:14, marginBottom:14 }}>
        <div style={{ fontWeight:600, marginBottom:10 }}>📏 หน่วยนับ</div>
        <div style={{ display:"flex", gap:7, flexWrap:"wrap", marginBottom:10 }}>
          {units.map(u => (
            <span key={u} className="chip" style={{ display:"inline-flex", gap:6, alignItems:"center" }}>
              {u}<button className="press" onClick={() => saveMeta(null, units.filter(x => x !== u))} style={{ color:"var(--red)" }}>✕</button>
            </span>
          ))}
        </div>
        <div className="row">
          <input value={newUnit} onChange={e => setNewUnit(e.target.value)} placeholder="เพิ่มหน่วยใหม่" />
          <button className="btn ghost press" onClick={() => {
            const v = newUnit.trim(); if (!v || units.includes(v)) return;
            saveMeta(null, [...units, v]); setNewUnit("");
          }}>เพิ่ม</button>
        </div>
      </div>

      <div className="card" style={{ padding:14, marginBottom:14 }}>
        <div style={{ fontWeight:600, marginBottom:10 }}>💾 ข้อมูล</div>
        <div style={{ display:"grid", gap:8 }}>
          <button className="btn ghost press" onClick={exportJson}>⬇️ สำรองรายการร้านนี้ (.json)</button>
          <button className="btn ghost press" onClick={() => impRef.current && impRef.current.click()}>⬆️ นำเข้าไฟล์สำรอง</button>
          <button className="btn gold press" onClick={loadSeed}>✨ โหลดข้อมูลตัวอย่าง</button>
          <button className="btn danger press" onClick={cleanupSeed}>🧹 ลบข้อมูลตัวอย่างออก</button>
          <button className="btn danger press" onClick={wipeShop} style={{ background:"#7A2733" }}>
            🗑 ล้างข้อมูลร้านนี้ทั้งหมด
          </button>
        </div>
        <div style={{ fontSize:11.5, color:"var(--muted)", marginTop:8, lineHeight:1.6 }}>
          🧹 ลบเฉพาะของที่ระบบสร้างให้ · ของที่คุณเพิ่มหรือแก้เองไม่หาย<br/>
          🗑 ล้างทุกอย่างของร้านที่เปิดอยู่ รวมประวัติ — กู้คืนไม่ได้ ควรกด ⬇️ สำรองก่อน
        </div>
        <input ref={impRef} type="file" accept=".json,application/json" style={{ display:"none" }}
          onChange={e => { const f = e.target.files && e.target.files[0]; if (f) importJson(f); e.target.value = ""; }} />
      </div>

      <div className="card" style={{ padding:14 }}>
        <div style={{ fontWeight:600, marginBottom:10 }}>🔑 PIN เจ้าของ</div>
        <div className="row">
          <input value={pin} onChange={e => setPin(e.target.value)} inputMode="numeric" />
          <button className="btn press" onClick={async () => {
            const v = pin.trim(); if (v.length < 4) { say("อย่างน้อย 4 หลัก"); return; }
            await setDoc("stockApp/config", { ownerPin: v }); setCfg({ ownerPin: v }); say("บันทึกแล้ว ✓");
          }}>บันทึก</button>
        </div>
      </div>
    </div>
  );
}

/* ---------- Sheet: ร้าน ---------- */
function ShopSheet({ shop, shops, onClose, onSave, onDelete }) {
  const [f, setF] = useState(() => shop ? { ...shop } : { id:"", name:"", emo:"🏪", color:"", bg:"none" });
  const set = (k, v) => setF(p => ({ ...p, [k]: v }));
  const usedColors = shops.filter(s => !shop || s.id !== shop.id).map(s => s.color);
  const free = PALETTE.filter(c => !usedColors.includes(c.k));

  useEffect(() => { if (!f.color && free.length) set("color", free[0].k); }, []);

  return (
    <Sheet title={shop ? "แก้ไขร้าน" : "เพิ่มร้าน"} onClose={onClose}>
      <Field label="ชื่อร้าน"><input value={f.name} onChange={e => set("name", e.target.value)} placeholder="เช่น Teddy สาขา 2" /></Field>
      <Field label="รหัสร้าน" hint={shop ? "แก้ไม่ได้" : "อังกฤษ ห้ามซ้ำ"}>
        <input value={f.id} disabled={!!shop} onChange={e => set("id", e.target.value.replace(/[^a-z0-9_]/g, ""))} placeholder="teddy2" />
      </Field>
      <Field label="ไอคอน">
        <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
          {["🏪","🧺","🪷","🧋","☕","🧼","💧","🛒","🍜","💈"].map(e => (
            <button key={e} className={"chip press " + (f.emo === e ? "on" : "")}
              onClick={() => set("emo", e)} style={{ fontSize:18 }}>{e}</button>
          ))}
        </div>
      </Field>

      <Field label="สีประจำร้าน" hint="ห้ามซ้ำกับร้านอื่น">
        <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(88px,1fr))", gap:8 }}>
          {PALETTE.map(c => {
            const taken = usedColors.includes(c.k);
            const on = f.color === c.k;
            return (
              <button key={c.k} className="press" disabled={taken} onClick={() => set("color", c.k)}
                style={{ padding:"9px 6px", borderRadius:13, background: c.tint, opacity: taken ? .3 : 1,
                  border:"2px solid " + (on ? c.head : "transparent"), textAlign:"center" }}>
                <span style={{ display:"block", width:"100%", height:20, borderRadius:7, background:c.head, marginBottom:5 }}></span>
                <span style={{ fontSize:10.5, color:c.head }}>{c.n}</span>
              </button>
            );
          })}
        </div>
      </Field>

      <Field label="ลายพื้นหลัง" hint="แสดงบนสีที่เลือกไว้">
        <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(84px,1fr))", gap:8 }}>
          {BGS.map(b => {
            const on = f.bg === b.k;
            return (
              <button key={b.k} className="press" onClick={() => set("bg", b.k)}
                style={{ padding:0, borderRadius:13, overflow:"hidden", textAlign:"center",
                  border:"2px solid " + (on ? colorOf(f.color).head : "var(--line)"), background:"#fff" }}>
                <span style={{ display:"block", height:46, backgroundColor:colorOf(f.color).tint,
                  backgroundImage: b.f ? `url('${b.f}')` : "none", backgroundSize:"96px 96px" }}></span>
                <span style={{ display:"block", fontSize:10.5, padding:"4px 2px", color:"var(--muted)" }}>{b.n}</span>
              </button>
            );
          })}
        </div>
      </Field>

      <div className="row" style={{ gap:8, marginTop:8 }}>
        {shop ? <button className="btn danger press" onClick={() => onDelete(shop)}>ลบ</button> : null}
        <button className="btn press" style={{ flex:1 }} onClick={() => {
          const id = (f.id || "").trim(), name = (f.name || "").trim();
          if (!id || !name) { alert("ใส่ชื่อร้านและรหัสร้าน"); return; }
          if (!f.color) { alert("เลือกสีประจำร้าน"); return; }
          onSave({ ...f, id, name });
        }}>บันทึก</button>
      </div>
    </Sheet>
  );
}
