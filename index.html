<style>
:root{
  --head:#113D6C; --tint:#F2F6FB;
  --card:#FFFFFF; --gold:#C68B4A; --ink:#1F2A37; --muted:#8A94A0;
  --line:#E7E2D8; --soft:#F3F0E8; --red:#BA3D4D; --green:#2E7D5B;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Kanit',system-ui,sans-serif; color:var(--ink);
  background-color:var(--tint); background-repeat:repeat; background-size:256px 256px;
  background-attachment:fixed;
  font-weight:400; font-size:15px; padding-bottom:env(safe-area-inset-bottom, 0px);
  transition:background-color .25s ease;
}
#root{max-width:560px;margin:0 auto;
  padding-left:env(safe-area-inset-left, 0px);
  padding-right:env(safe-area-inset-right, 0px);
  padding-top:env(safe-area-inset-top, 0px)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;
  box-shadow:0 2px 10px rgba(20,30,45,.05)}
.press{cursor:pointer;transition:transform .08s ease}
.press:active{transform:scale(.975)}
button{font-family:inherit;font-size:inherit;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink);
  border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:-1px}
.btn{background:var(--head);color:#fff;border-radius:14px;padding:12px 16px;font-weight:500;
  display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.gold{background:var(--gold)}
.btn.ghost{background:var(--soft);color:var(--head)}
.btn.danger{background:var(--red)}
.btn:disabled{opacity:.45}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;
  font-size:13px;white-space:nowrap}
.chip.on{background:var(--head);color:#fff;border-color:var(--head)}
.row{display:flex;align-items:center;gap:10px}
.scroll-x{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 8px;scrollbar-width:none}
.scroll-x::-webkit-scrollbar{display:none}
.lbl{font-size:12px;color:var(--muted);margin-bottom:4px;display:block}
.hdr{color:#fff;border-radius:0 0 26px 26px;position:relative;overflow:hidden;
  background:var(--head);
  padding:14px 16px 18px;
  padding-top:calc(14px + env(safe-area-inset-top, 0px));
  padding-left:calc(16px + env(safe-area-inset-left, 0px));
  padding-right:calc(16px + env(safe-area-inset-right, 0px));
  margin-top:calc(-1 * env(safe-area-inset-top, 0px))}
.hdr::before{content:"";position:absolute;inset:0;z-index:0;
  background:linear-gradient(115deg,rgba(0,0,0,.22),rgba(255,255,255,.10))}
.hdr>*{position:relative;z-index:1}
.tag{font-size:11px;padding:3px 8px;border-radius:999px;font-weight:500}
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(15,25,40,.45)}
.sheet-hd{position:sticky;top:-18px;z-index:2;display:flex;align-items:center;gap:10px;
  background:var(--tint);margin:-18px -16px 12px;padding:16px 16px 12px;
  border-bottom:1px solid var(--line)}
.sheet-in{position:relative;background:var(--tint);width:100%;max-width:560px;
  border-radius:24px 24px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom, 0px));
  max-height:calc(90vh - env(safe-area-inset-top, 0px));overflow:auto;animation:up .18s ease}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(255,255,255,.97);
  backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding:6px 0 calc(6px + env(safe-area-inset-bottom, 0px));display:flex;
  padding-left:env(safe-area-inset-left, 0px);padding-right:env(safe-area-inset-right, 0px)}
.nav>button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 0;font-size:10.5px;color:var(--muted)}
.nav>button.on{color:var(--head);font-weight:500}
.nav .ic{font-size:20px;line-height:1}
.thumb{width:48px;height:48px;border-radius:12px;object-fit:cover;background:var(--soft);
  display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:none}
.empty{text-align:center;color:var(--muted);padding:36px 20px;font-size:14px}
.emptypic{width:140px;height:140px;object-fit:contain;opacity:.92;margin:0 auto 6px;display:block;border-radius:20px}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:16px;
  border:1px solid var(--line);background:#fff}
.tbl{border-collapse:collapse;width:100%;min-width:560px;font-size:12.5px}
.tbl th{background:var(--head);color:#fff;font-weight:500;padding:9px 8px;text-align:center;
  white-space:nowrap;position:sticky;top:0;z-index:1}
.tbl td{padding:8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.tbl td.nm{text-align:left;white-space:normal;min-width:170px;line-height:1.35}
.tbl tr.grp td{background:linear-gradient(90deg,var(--gold),rgba(198,139,74,.72));color:#fff;
  font-weight:600;text-align:left;padding:8px 11px;font-size:13px;position:sticky;left:0}
.tbl tr.alt td{background:#FBFAF6}
.tbl tr.low td{background:#FDF1F2}
.tbl tr.band td{color:#1F2A37;font-weight:600;text-align:left;padding:7px 10px;font-size:12.5px}
.tbl input.cnt{width:72px;padding:6px 4px;text-align:center;font-weight:600;font-size:15px;
  border-radius:9px;border:1.5px solid var(--gold);background:#fff}
.tbl td.doing{background:#EAF5EE}
.tbl .num{font-weight:600;font-variant-numeric:tabular-nums}
.swipe{position:relative;overflow:hidden;border-radius:18px}
.swipe-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;font-size:13.5;font-weight:500;color:#fff;border-radius:18px}
.swipe-fg{position:relative;transition:transform .16s ease;will-change:transform;touch-action:pan-y}
.sect{font-weight:600;font-size:13px;color:var(--muted);margin:16px 16px 7px}

/* จอกว้าง / หมุนแนวนอน — ขยายให้เห็นตารางครบทุกคอลัมน์ */
@media (min-width:700px){
  #root{max-width:1024px}
  .sheet-in{max-width:720px}
  .tbl{min-width:0}
  .tbl th,.tbl td{padding:9px 10px;font-size:13.5px}
  .tbl td.nm{min-width:0}
  .nav{max-width:1024px;left:50%;transform:translateX(-50%);border-radius:18px 18px 0 0;
    border-left:1px solid var(--line);border-right:1px solid var(--line)}
}
@media (min-width:1100px){
  #root{max-width:1180px}
  .nav{max-width:1180px}
}
</style>
</head>

const pad = n => String(n).padStart(2, "0");
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => dstr(new Date());
const monthOf = s => (s || "").slice(0, 7);
const nf = n => (Math.round((Number(n) || 0) * 100) / 100).toLocaleString("th-TH");
const money = n => "฿" + nf(n);
const THMON = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
const thDate = s => { if (!s) return "-"; const [y,m,d] = s.split("-"); return `${+d} ${THMON[+m-1]} ${(+y+543)%100}`; };
const lastMonths = n => {
  const r = []; const d = new Date();
  for (let i = 0; i < n; i++) { r.push(`${d.getFullYear()}-${pad(d.getMonth()+1)}`); d.setMonth(d.getMonth()-1); }
  return r;
};

const MEM = {};
const LS = {
  get(k) { try { const v = localStorage.getItem(k); return v === null ? (MEM[k] === undefined ? null : MEM[k]) : v; } catch (e) { return MEM[k] === undefined ? null : MEM[k]; } },
  set(k, v) { MEM[k] = v; try { localStorage.setItem(k, v); } catch (e) {} }
};

function compressImg(file, max, q) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const im = new Image();
      im.onload = () => {
        let { width:w, height:h } = im;
        const sc = Math.min(1, max / Math.max(w, h));
        w = Math.round(w * sc); h = Math.round(h * sc);
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        const x = c.getContext("2d");
        x.fillStyle = "#fff"; x.fillRect(0, 0, w, h);
        x.drawImage(im, 0, 0, w, h);
        res(c.toDataURL("image/jpeg", q));
      };
      im.onerror = rej; im.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}
function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = src; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
}

/* ---------- firebase ---------- */
let db = null, fbReady = false;
try {
  if (FIREBASE_CONFIG.apiKey !== "PASTE_API_KEY") {
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
    firebase.auth().signInAnonymously().catch(() => {});
    fbReady = true;
  }
} catch (e) { console.error(e); }

const LOCAL_MODE = !fbReady;
let onDbError = null, onDbOk = null;
const reportErr = (where, e) => {
  console.error(where, e);
  if (onDbError) onDbError((e && e.code ? e.code + " — " : "") + (e && e.message ? e.message : String(e)));
};
const reportOk = () => { if (onDbOk) onDbOk(Date.now()); };
const LKEY = p => "psdb:" + p;

async function getDoc(p) {
  if (LOCAL_MODE) { const v = LS.get(LKEY(p)); try { return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  try { const s = await db.doc(p).get(); reportOk(); return s.exists ? s.data() : null; }
  catch (e) { reportErr("อ่าน " + p, e); return null; }
}
async function setDoc(p, data) {
  if (LOCAL_MODE) {
    const old = (await getDoc(p)) || {};
    LS.set(LKEY(p), JSON.stringify({ ...old, ...data }));
    return true;
  }
  try { await db.doc(p).set(data, { merge:true }); reportOk(); return true; }
  catch (e) { reportErr("เขียน " + p, e); return false; }
}
function watchDoc(p, cb) {
  if (LOCAL_MODE) { getDoc(p).then(cb); return () => {}; }
  return db.doc(p).onSnapshot(
    s => { reportOk(); cb(s.exists ? s.data() : null); },
    e => reportErr("อ่าน " + p, e)
  );
}
async function txDoc(p, mutate) {
  if (LOCAL_MODE) {
    const cur = (await getDoc(p)) || {};
    const next = mutate(cur);
    LS.set(LKEY(p), JSON.stringify(next));
    return next;
  }
  const ref = db.doc(p);
  try {
    const r = await db.runTransaction(async t => {
      const s = await t.get(ref);
      const next = mutate(s.exists ? s.data() : {});
      t.set(ref, next);
      return next;
    });
    reportOk();
    return r;
  } catch (e) { reportErr("บันทึก " + p, e); return null; }
}

const BAND = ["#DCE6F1","#E8EEDC","#F5E1E1","#E6E0EF","#FBE8D5","#DFF0EF","#F2E8D8"];

function groupByVendor(items) {

  items.forEach(i => { (by[i.vendor || "ไม่ระบุร้าน"] = by[i.vendor || "ไม่ระบุร้าน"] || []).push(i); });
  return Object.entries(by).sort((a, b) => a[0].localeCompare(b[0], "th"));
}
const unitCell = i => {

};

function renderFormImage({ shop, items, latest, vals, withValues }) {
  const groups = groupByVendor(items);
  const COLS = [
    { k:"vendor", t:"สถานที่",  w:118, a:"left"  },
    { k:"min",    t:"ควรมี",    w:70 },
    { k:"unit",   t:"หน่วย",     w:150 },
    { k:"have",   t:"เหลือ",     w:82 },
    { k:"order",  t:"สั่ง",      w:70 },
    { k:"name",   t:"รายการ",   w:282, a:"left"  },
    { k:"qty",    t:"ปริมาณ",   w:98 },
    { k:"price",  t:"ราคา",     w:82 },
  ];
  const PAD = 24, RH = 36, HH = 42;
  const W = PAD * 2 + COLS.reduce((s2, c) => s2 + c.w, 0);
  const TOP = 118;
  const rows = items.length + groups.length;      // แถวของ + แถวคั่นกลุ่ม
  const H = TOP + HH + rows * RH + 86;

  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const x = c.getContext("2d");
  const head = colorOf(shop && shop.color).head;

  x.fillStyle = "#FFFFFF"; x.fillRect(0, 0, W, H);

  /* หัวกระดาษ */
  x.fillStyle = head; x.fillRect(0, 0, W, 96);
  x.fillStyle = "#fff"; x.textAlign = "center";
  x.font = "600 30px Kanit, sans-serif";
  x.fillText(`แบบฟอร์มเช็คสต๊อก — ${shop ? shop.name : ""}`, W / 2, 44);
  x.font = "400 18px Kanit, sans-serif"; x.globalAlpha = .9;
  x.fillText(withValues
    ? `บันทึกยอดแล้ว · ${thDate(today())} · รวม ${items.length} รายการ`
    : `วันที่ ................  ผู้นับ ................  ผู้ตรวจ ................`, W / 2, 76);
  x.globalAlpha = 1; x.textAlign = "left";

  /* หัวตาราง */
  let cx = PAD, y = TOP;
  x.fillStyle = "#3A4452"; x.fillRect(PAD, y, W - PAD * 2, HH);
  x.fillStyle = "#fff"; x.font = "500 17px Kanit, sans-serif";
  COLS.forEach(col => {
    x.textAlign = "center";
    x.fillText(col.t, cx + col.w / 2, y + 27);
    cx += col.w;
  });
  y += HH;

  const line = (x1, y1, x2, y2) => { x.beginPath(); x.moveTo(x1, y1); x.lineTo(x2, y2); x.stroke(); };
  const fit = (t, w) => {
    let s2 = String(t == null ? "" : t);
    if (x.measureText(s2).width <= w) return s2;
    while (s2.length && x.measureText(s2 + "…").width > w) s2 = s2.slice(0, -1);
    return s2 + "…";
  };

  groups.forEach(([vendor, arr], gi) => {
    const band = BAND[gi % BAND.length];
    arr.forEach((i, k) => {
      const v = vals && vals[i.id] !== undefined && vals[i.id] !== "" ? vals[i.id] : "";
      const low = withValues && v !== "" && Number(i.min) > 0 && Number(v) <= Number(i.min);
      const need = low ? suggestQty(i, { map:{ [i.id]:{ qty:Number(v) } } }) : "";
      const p = packOf(i);
      const cells = {
        vendor: k === 0 ? vendor : "",
        min: Number(i.min) > 0 ? nf(i.min) : "",
        unit: p ? `${i.unit} (1${p.unit}มี${nf(p.size)}${i.unit})` : i.unit,
        have: withValues && v !== "" ? nf(v) : "",
        order: need ? nf(need) : "",
        name: i.name + (i.brand ? ` (${i.brand})` : ""),
        qty: i.detail || "",
        price: Number(i.price) ? nf(i.price) : "",
      };

      x.fillStyle = low ? "#FBE4E6" : band;
      x.fillRect(PAD, y, W - PAD * 2, RH);

      cx = PAD;
      COLS.forEach(col => {
        if (col.k === "have" || col.k === "order") { x.fillStyle = "#fff"; x.fillRect(cx, y, col.w, RH); }
        const val = cells[col.k];
        if (val !== "") {
          x.fillStyle = col.k === "order" ? "#9A5B1B" : col.k === "have" ? "#1F2A37" : "#1F2A37";
          const bold = ["name", "have", "order"].includes(col.k) || col.k === "vendor";
          x.font = `${bold ? 600 : 400} ${col.k === "unit" || col.k === "qty" ? 14 : col.k === "vendor" ? 14 : 16}px Kanit, sans-serif`;
          if (col.a === "left") { x.textAlign = "left"; x.fillText(fit(val, col.w - 16), cx + 8, y + 24); }
          else { x.textAlign = "center"; x.fillText(fit(val, col.w - 10), cx + col.w / 2, y + 24); }
        }
        cx += col.w;
      });

      x.strokeStyle = "#B9BFC7"; x.lineWidth = 1;
      cx = PAD;
      COLS.forEach(col => { line(cx + .5, y, cx + .5, y + RH); cx += col.w; });
      line(cx - .5, y, cx - .5, y + RH);
      line(PAD, y + RH - .5, W - PAD, y + RH - .5);
      y += RH;
    });
    x.fillStyle = "#FFFFFF"; x.fillRect(PAD, y, W - PAD * 2, RH);
    y += RH;
  });

  x.strokeStyle = "#6B7480"; x.lineWidth = 2;
  x.strokeRect(PAD, TOP, W - PAD * 2, y - TOP);

  x.fillStyle = "#5A6472"; x.font = "400 16px Kanit, sans-serif"; x.textAlign = "left";
  x.fillText(withValues
    ? `รวม ${items.length} รายการ · ${thDate(today())}`
    : "นับของจริงแล้วเขียนในช่อง เหลือ · ช่อง สั่ง ให้หัวหน้ากรอก", PAD, y + 34);
  x.textAlign = "right";
  x.fillText("Stock PLP", W - PAD, y + 34);
  return c;
}

function buildText(kind, shopName, head, groups, footer) {
  let t = `${kind}  ${shopName}\n${head}\n`;
  groups.forEach(g => {
    t += `\n【${g.title}】\n`;
    g.lines.forEach(l => { t += `• ${l.left}${l.right ? "  —  " + l.right : ""}${l.flag ? " " + l.flag : ""}\n`; });
  });
  if (footer) t += `\n${footer}`;
  return t;
}

async function renderImage(opts) {
  const W = 760, P = 34;
  const c = document.createElement("canvas");
  const ctx = c.getContext("2d");
  const F = w => `${w} 20px Kanit, sans-serif`;
  let h = 150;
  opts.groups.forEach(g => { h += 46 + g.lines.length * 38; });
  h += opts.footer ? 90 : 40;
  c.width = W; c.height = h;

  ctx.fillStyle = "#FFFFFF"; ctx.fillRect(0, 0, W, h);
  ctx.fillStyle = opts.color; ctx.fillRect(0, 0, W, 108);
  ctx.fillStyle = "#fff";
  ctx.font = "600 30px Kanit, sans-serif";
  ctx.fillText(opts.title, P, 48);
  ctx.font = "400 19px Kanit, sans-serif";
  ctx.globalAlpha = .85;
  ctx.fillText(opts.head, P, 82);
  ctx.globalAlpha = 1;

  if (opts.logo) {
    try {
      const im = await new Promise((res, rej) => {
        const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = opts.logo;
      });
      const D = 72, X = W - P - D, Y = 18;
      ctx.save();
      ctx.beginPath(); ctx.arc(X + D/2, Y + D/2, D/2, 0, Math.PI*2); ctx.closePath(); ctx.clip();
      ctx.fillStyle = "#fff"; ctx.fillRect(X, Y, D, D);
      ctx.drawImage(im, X, Y, D, D);
      ctx.restore();
    } catch (e) {}
  }

  let y = 152;
  opts.groups.forEach(g => {
    ctx.fillStyle = opts.color; ctx.globalAlpha = .10;
    ctx.fillRect(P - 10, y - 24, W - (P - 10) * 2, 34);
    ctx.globalAlpha = 1;
    ctx.fillStyle = opts.color;
    ctx.font = "600 20px Kanit, sans-serif";
    ctx.fillText(g.title, P, y);
    y += 44;
    g.lines.forEach(l => {
      ctx.fillStyle = l.flag ? "#BA3D4D" : "#1F2A37";
      ctx.font = F(l.flag ? 500 : 400);
      let left = l.left;
      while (ctx.measureText(left).width > W - P * 2 - 190) left = left.slice(0, -2);
      if (left !== l.left) left += "…";
      ctx.fillText(left + (l.flag ? "  " + l.flag : ""), P, y);
      if (l.right) {
        ctx.textAlign = "right";
        ctx.font = "600 20px Kanit, sans-serif";
        ctx.fillText(l.right, W - P, y);
        ctx.textAlign = "left";
      }
      ctx.strokeStyle = "#EFEBE2"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(P, y + 12); ctx.lineTo(W - P, y + 12); ctx.stroke();
      y += 38;
    });
    y += 10;
  });

  if (opts.footer) {
    ctx.fillStyle = "#F3F0E8"; ctx.fillRect(0, h - 74, W, 74);
    ctx.fillStyle = "#5A6472"; ctx.font = "500 20px Kanit, sans-serif";
    ctx.fillText(opts.footer, P, h - 30);
  }
  return c;
}

async function shareCanvas(canvas, filename, say) {
  const blob = await new Promise(r => canvas.toBlob(r, "image/png"));
  const file = new File([blob], filename, { type:"image/png" });
  try {
    if (navigator.canShare && navigator.canShare({ files:[file] })) {
      await navigator.share({ files:[file] });
      return;
    }
  } catch (e) { if (e && e.name === "AbortError") return; }
  try {
    await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
    say("คัดลอกรูปแล้ว ✓ วางในไลน์ได้เลย");
    return;
  } catch (e) {}
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  say("บันทึกรูปลงเครื่องแล้ว");
}
function copyText(t, say) {
  navigator.clipboard.writeText(t).then(() => say("คัดลอกข้อความแล้ว ✓"), () => say("คัดลอกไม่ได้"));
}

/* ปัดขวา = แก้ไข · ปัดซ้าย = ลบ */
function SwipeRow({ onEdit, onDelete, children }) {
  const [dx, setDx] = useState(0);
  const st = useRef(null);
  const LIMIT = 96, TRIG = 66;

  const down = e => {
    const t = e.touches ? e.touches[0] : e;
    st.current = { x:t.clientX, y:t.clientY, lock:null };
  };
  const move = e => {
    if (!st.current) return;
    const t = e.touches ? e.touches[0] : e;
    const ax = t.clientX - st.current.x, ay = t.clientY - st.current.y;
    if (st.current.lock === null) {
      if (Math.abs(ax) < 8 && Math.abs(ay) < 8) return;
      st.current.lock = Math.abs(ax) > Math.abs(ay) ? "x" : "y";
    }
    if (st.current.lock !== "x") return;
    let v = ax;
    if (v > 0 && !onEdit) v = 0;
    if (v < 0 && !onDelete) v = 0;
    setDx(Math.max(-LIMIT, Math.min(LIMIT, v)));
  };
  const up = () => {
    const v = dx;
    setDx(0);
    st.current = null;
    if (v >= TRIG && onEdit) onEdit();
    else if (v <= -TRIG && onDelete) onDelete();
  };

  return (
    <div className="swipe">
      <div className="swipe-bg" style={{ background: dx > 0 ? "var(--head)" : dx < 0 ? "var(--red)" : "transparent" }}>
        <span style={{ opacity: dx > 0 ? 1 : 0 }}>✏️ แก้ไข</span>
        <span style={{ opacity: dx < 0 ? 1 : 0 }}>🗑 ลบ</span>
      </div>
      <div className="swipe-fg" style={{ transform:`translateX(${dx}px)` }}
        onTouchStart={down} onTouchMove={move} onTouchEnd={up} onTouchCancel={up}>
        {children}
      </div>
    </div>
  );
}

  const [lastSync, setLastSync] = useState(0);
  const [canInstall, setCanInstall] = useState(!!window.__pwaPrompt);
  const [hideInstall, setHideInstall] = useState(LS.get("ps_hideinstall") === "1");

  const [items, setItems] = useState([]);
  const [cats, setCats] = useState(DEFAULT_CATS);
  const [units, setUnits] = useState(DEFAULT_UNITS);
  const [vendors, setVendors] = useState([]);      // ส่วนกลาง ใช้ร่วมทุกร้าน
  const [shopVendors, setShopVendors] = useState([]); // ของเก่าที่เคยเก็บแยกร้าน
  const [photos, setPhotos] = useState({});
  const [logos, setLogos] = useState({});
  const [counts, setCounts] = useState({});   // { "YYYY-MM": [session,...] }
  const [orders, setOrders] = useState({});
  const [loadingShop, setLoadingShop] = useState(false);
  const [toast, setToast] = useState("");
  const [sheet, setSheet] = useState(null);
  const [undoStack, setUndoStack] = useState([]);
  const [orderDraft, setOrderDraft] = useState({});   // { itemId: qty }
  const [orderVendor, setOrderVendor] = useState({}); // { itemId: ชื่อร้านที่จะไปซื้อ }
  const [editRec, setEditRec] = useState(null);      // รายการย้อนหลังที่กำลังแก้

  const isOwner = role === "owner";
  const shop = useMemo(() => shops.find(s => s.id === shopId) || null, [shops, shopId]);
  const say = m => { setToast(m); setTimeout(() => setToast(""), 2000); };

  /* ---- ธีมตามร้าน ---- */
  useEffect(() => {
    const c = colorOf(shop && shop.color);
    const b = BGS.find(x => x.k === (shop && shop.bg));
    document.documentElement.style.setProperty("--head", c.head);
    document.documentElement.style.setProperty("--tint", c.tint);
    document.body.style.backgroundImage = (b && b.f) ? `url('${b.f}')` : "none";
    const m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute("content", c.head);
  }, [shop]);

  useEffect(() => {
    onDbError = m => setDbError(m);
    onDbOk = t => { setLastSync(t); setDbError(""); };
    return () => { onDbError = null; onDbOk = null; };
  }, []);

  /* ---- ปุ่มติดตั้งแอป ---- */
  useEffect(() => {
    const on = () => setCanInstall(true);
    const off = () => { setCanInstall(false); setHideInstall(true); };
    window.addEventListener("pwa-installable", on);
    window.addEventListener("pwa-installed", off);
    return () => { window.removeEventListener("pwa-installable", on); window.removeEventListener("pwa-installed", off); };
  }, []);

  const installApp = async () => {
    const p = window.__pwaPrompt;
    if (!p) {
      alert("ติดตั้งเองได้เลย:\n\nAndroid Chrome → เมนู ⋮ → เพิ่มลงในหน้าจอหลัก\niPhone Safari → ปุ่มแชร์ ↑ → Add to Home Screen");
      return;
    }
    p.prompt();
    await p.userChoice;
    window.__pwaPrompt = null;
    setCanInstall(false);
  };

  /* ---- boot ---- */
  useEffect(() => {
    const u1 = watchDoc("stockApp/shops", d => { setShops((d && d.list) || []); setOnline(true); setBooting(false); });
    const u2 = watchDoc("stockApp/config", d => { if (d) setCfg({ ownerPin: d.ownerPin || "1234" }); });
    const u3 = watchDoc("stockApp/logos", d => setLogos((d && d.l) || {}));
    const u4 = watchDoc("stockApp/vendors", d => setVendors((d && d.list) || []));
    const t = setTimeout(() => setBooting(false), 6000);
    return () => { u1(); u2(); u3(); u4(); clearTimeout(t); };
  }, []);

  useEffect(() => {
    if (shops.length && !shops.some(x => x.id === shopId)) setShopId(shops[0].id);
  }, [shops]);

  /* ---- ข้อมูลร้าน ---- */
  useEffect(() => {
    if (!shopId) return;
    setLoadingShop(true); setCounts({}); setOrders({}); setOrderDraft({}); setOrderVendor({});
    setUndoStack(readUndo(shopId));
    const mk = monthOf(today());
    const u1 = watchDoc("stockItems/" + shopId, d => {
      setItems((d && d.items) || []);
      setCats((d && d.cats && d.cats.length) ? d.cats : DEFAULT_CATS);
      setUnits((d && d.units && d.units.length) ? d.units : DEFAULT_UNITS);
      setShopVendors((d && d.vendors) || []);
      setLoadingShop(false);
    });
    const u2 = watchDoc("stockPhotos/" + shopId, d => setPhotos((d && d.p) || {}));
    const u3 = watchDoc(`stockCounts/${shopId}_${mk}`, d => setCounts(p => ({ ...p, [mk]: (d && d.list) || [] })));
    const u4 = watchDoc(`stockOrders/${shopId}_${mk}`, d => setOrders(p => ({ ...p, [mk]: (d && d.list) || [] })));
    (async () => {
      for (const m of lastMonths(3).slice(1)) {
        const c = await getDoc(`stockCounts/${shopId}_${m}`);
        setCounts(p => ({ ...p, [m]: (c && c.list) || [] }));
      }
    })();
    LS.set("ps_shop", shopId);
    return () => { u1(); u2(); u3(); u4(); };
  }, [shopId]);

  /* ---- undo ---- */
  const UNDO_TTL = 60 * 60 * 1000;
  const readUndo = sid => {
    try { return (JSON.parse(LS.get("ps_undo:" + sid) || "[]")).filter(e => Date.now() - e.ts < UNDO_TTL); }
    catch (e) { return []; }
  };
  const writeUndo = (sid, arr) => { LS.set("ps_undo:" + sid, JSON.stringify(arr)); setUndoStack(arr); };
  const pushUndo = entry => { if (shopId) writeUndo(shopId, [{ ...entry, id:uid(), ts:Date.now() }, ...readUndo(shopId)].slice(0, 20)); };
  useEffect(() => {
    const t = setInterval(() => setUndoStack(readUndo(shopId)), 60000);
    return () => clearInterval(t);
  }, [shopId]);

  /* ---- writers ---- */
  const saveMeta = async (nextCats, nextUnits) => {
    if (nextCats) setCats(nextCats);
    if (nextUnits) setUnits(nextUnits);
    await txDoc("stockItems/" + shopId, cur => ({
      ...cur, items: cur.items || items,
      cats: nextCats || cur.cats || cats,
      units: nextUnits || cur.units || units
    }));
  };

  /* รายชื่อร้านที่ซื้อของ — เก็บส่วนกลาง ทุกสาขาเห็นเหมือนกัน */
  const saveVendors = async list => {
    const clean = [...new Set(list.filter(Boolean))].sort((a, b) => a.localeCompare(b, "th"));
    setVendors(clean);
    await txDoc("stockApp/vendors", () => ({ list: clean }));
  };
  const upsertItem = async (it, undoLabel) => {
    const before = items.find(x => x.id === it.id) || null;
    setItems(prev => prev.some(x => x.id === it.id) ? prev.map(x => x.id === it.id ? it : x) : [...prev, it]);
    await txDoc("stockItems/" + shopId, cur => {
      const arr = (cur.items || []).slice();
      const k = arr.findIndex(x => x.id === it.id);
      if (k >= 0) arr[k] = it; else arr.push(it);
      return { ...cur, items: arr, cats: cur.cats || cats, units: cur.units || units };
    });
    if (undoLabel) pushUndo({ kind:"item", label:undoLabel, before, after:it });
  };
  const removeItem = async (id, undoLabel) => {
    const before = items.find(x => x.id === id) || null;
    setItems(prev => prev.filter(x => x.id !== id));
    await txDoc("stockItems/" + shopId, cur => ({ ...cur, items: (cur.items || []).filter(x => x.id !== id) }));
    if (undoLabel && before) pushUndo({ kind:"itemDel", label:undoLabel, item:before, photo:photos[id] || null });
  };
  const savePhoto = async (key, dataUrl) => {
    await txDoc("stockPhotos/" + shopId, cur => {
      const p = { ...(cur.p || {}) };
      if (dataUrl) p[key] = dataUrl; else delete p[key];
      return { p };
    });
  };
  const saveShops = async list => { setShops(list); await txDoc("stockApp/shops", () => ({ list })); };
  const saveLogo = async (sid, dataUrl) => {
    setLogos(p => { const n = { ...p }; if (dataUrl) n[sid] = dataUrl; else delete n[sid]; return n; });
    await txDoc("stockApp/logos", cur => {
      const l = { ...(cur.l || {}) };
      if (dataUrl) l[sid] = dataUrl; else delete l[sid];
      return { l };
    });
  };

  const saveCount = async session => {
    const mk = monthOf(session.date);
    setCounts(p => ({ ...p, [mk]: [session, ...(p[mk] || []).filter(x => x.id !== session.id)] }));
    await txDoc(`stockCounts/${shopId}_${mk}`, cur => ({
      list: [session, ...(cur.list || []).filter(x => x.id !== session.id)]
    }));
    pushUndo({ kind:"count", label:`บันทึกการนับ ${thDate(session.date)}`, mk, sid:session.id });
  };
  const saveOrder = async order => {
    const mk = monthOf(order.date);
    setOrders(p => ({ ...p, [mk]: [order, ...(p[mk] || []).filter(x => x.id !== order.id)] }));
    await txDoc(`stockOrders/${shopId}_${mk}`, cur => ({
      list: [order, ...(cur.list || []).filter(x => x.id !== order.id)]
    }));
    pushUndo({ kind:"order", label:`บันทึกใบสั่งของ ${thDate(order.date)}`, mk, sid:order.id });
  };
  const delRecord = async (type, mk, id) => {
    const path = `${type === "count" ? "stockCounts" : "stockOrders"}/${shopId}_${mk}`;
    const setter = type === "count" ? setCounts : setOrders;
    setter(p => ({ ...p, [mk]: (p[mk] || []).filter(x => x.id !== id) }));
    await txDoc(path, cur => ({ list: (cur.list || []).filter(x => x.id !== id) }));
    say("ลบแล้ว");
  };
  const loadMonth = async (type, mk) => {
    const store = type === "count" ? counts : orders;
    if (store[mk]) return;
    const d = await getDoc(`${type === "count" ? "stockCounts" : "stockOrders"}/${shopId}_${mk}`);
    (type === "count" ? setCounts : setOrders)(p => ({ ...p, [mk]: (d && d.list) || [] }));
  };

  const onDeleteItem = async it => {
    if (!confirm(`ลบ ${it.name}\n\nลบถาวร ยืนยัน?`)) return;
    await removeItem(it.id, "ลบ " + it.name);
    await savePhoto(it.id, null);
    say("ลบแล้ว · กด ↩︎ เพื่อย้อนกลับได้");
  };

  const openEdit = (kind, r) => {
    if (kind === "count") { setEditRec({ kind:"count", rec:r }); setTab("count"); say("แก้ไขการนับ " + thDate(r.date)); }
    else {
      const d = {}, v = {};
      (r.lines || []).forEach(l => { d[l.itemId] = l.qty; if (l.vendor) v[l.itemId] = l.vendor; });
      setOrderDraft(d); setOrderVendor(v);
      setEditRec({ kind:"order", rec:r }); setTab("order"); say("แก้ไขใบสั่งของ " + thDate(r.date));
    }
  };

  const undoLast = async () => {
    const stack = readUndo(shopId);
    if (!stack.length) { say("ไม่มีอะไรให้ย้อนกลับ"); return; }
    const e = stack[0];
    if (!confirm("เลิกทำ:\n" + e.label + "\n\nยืนยัน?")) return;
    try {
      if (e.kind === "item") { if (e.before) await upsertItem(e.before, null); else await removeItem(e.after.id, null); }
      else if (e.kind === "itemDel") { await upsertItem(e.item, null); if (e.photo) await savePhoto(e.item.id, e.photo); }
      else if (e.kind === "count") await delRecord("count", e.mk, e.sid);
      else if (e.kind === "order") await delRecord("order", e.mk, e.sid);
      writeUndo(shopId, stack.slice(1));
      say("ย้อนกลับแล้ว ✓");
    } catch (err) { alert("ย้อนกลับไม่สำเร็จ: " + err.message); }
  };

  const askOwner = () => {
    if (isOwner) { setRole("staff"); LS.set("ps_role","staff"); say("โหมดพนักงาน"); return; }
    const p = prompt("ใส่ PIN เจ้าของ");
    if (p === null) return;
    if (p === cfg.ownerPin) { setRole("owner"); LS.set("ps_role","owner"); say("โหมดเจ้าของ ✓"); }
    else say("PIN ไม่ถูกต้อง");
  };

  const loadSeed = async () => {
    if (shops.length && !confirm("เพิ่มร้านตัวอย่าง? ร้านเดิมไม่ถูกลบ")) return;
    say("กำลังสร้าง…");
    const merged = shops.slice();
    for (const s of SEED.shops) {
      if (!merged.some(x => x.id === s.id)) merged.push(s);
      const cur = await getDoc("stockItems/" + s.id);
      if (!cur || !(cur.items || []).length) await setDoc("stockItems/" + s.id, SEED.build(s.id));
    }
    await saveShops(merged);
    setShopId(merged[0].id);
    say("โหลดข้อมูลตัวอย่างแล้ว ✓");
  };
  /* เช็คว่าเป็นข้อมูลตัวอย่างไหม — ดูทั้งธงและชื่อ เผื่อข้อมูลเก่าที่ยังไม่มีธง */
  const isSeedShop = sh => sh.seed === true || SEED.shops.some(x => x.id === sh.id);
  const seedNameSet = id => {
    if (!SEED.shops.some(x => x.id === id)) return null;
    return new Set(SEED.build(id).items.map(i => i.name));
  };
  const clearRecords = async sid => {
    for (const m of lastMonths(12)) {
      for (const col of ["stockCounts", "stockOrders"]) {
        const d = await getDoc(`${col}/${sid}_${m}`);
        if (d && (d.list || []).length) await setDoc(`${col}/${sid}_${m}`, { list: [] });
      }
    }
  };

  const cleanupSeed = async () => {
    if (!confirm("ลบเฉพาะข้อมูลตัวอย่างที่ระบบสร้างให้\nรายการที่คุณเพิ่มเองจะไม่ถูกลบ\n\nยืนยัน?")) return;
    say("กำลังลบ…");
    const keep = [];
    let nItem = 0, nShop = 0;
    for (const sh of shops) {
      const names = seedNameSet(sh.id);
      const d = await getDoc("stockItems/" + sh.id);
      const all = (d && d.items) || [];
      const mine = all.filter(x => !(x.seed === true || (names && names.has(x.name))));
      if (all.length !== mine.length) {
        nItem += all.length - mine.length;
        await txDoc("stockItems/" + sh.id, cur => ({ ...cur, items: mine }));
      }
      if (isSeedShop(sh) && !mine.length) {
        nShop++;
        await setDoc("stockPhotos/" + sh.id, { p:{} });
        await clearRecords(sh.id);
      } else keep.push(sh);
    }
    if (keep.length !== shops.length) await saveShops(keep);
    setShopId(keep.some(x => x.id === shopId) ? shopId : (keep.length ? keep[0].id : ""));
    writeUndo(shopId, []);
    if (!nItem && !nShop) alert("ไม่พบข้อมูลตัวอย่างในระบบ\n\nถ้าอยากล้างร้านนี้ทั้งหมด ให้ใช้ปุ่ม 🗑 ล้างข้อมูลร้านนี้ ด้านล่าง");
    else say(`ลบแล้ว ${nShop} ร้าน · ${nItem} รายการ ✓`);
  };

  const wipeShop = async () => {
    if (!shop) return;
    if (!confirm(`ล้างข้อมูลร้าน ${shop.name} ทั้งหมด\n\n· รายการของ ${items.length} รายการ\n· ประวัติการนับและใบสั่งของ\n· รูปทั้งหมด\n\nลบถาวร กู้คืนไม่ได้ ยืนยัน?`)) return;
    if (prompt('พิมพ์คำว่า  ลบ  เพื่อยืนยัน') !== "ลบ") { say("ยกเลิกแล้ว"); return; }
    say("กำลังล้าง…");
    await txDoc("stockItems/" + shop.id, cur => ({ ...cur, items: [] }));
    await setDoc("stockPhotos/" + shop.id, { p:{} });
    await clearRecords(shop.id);
    setItems([]); setCounts({}); setOrders({}); setOrderDraft({}); setOrderVendor({});
    writeUndo(shop.id, []);
    say("ล้างข้อมูลร้านนี้แล้ว ✓");
  };

  const resetAll = async () => {
    if (!confirm("ล้างข้อมูลของทุกร้าน\n\nลบ:\n· รายการของทุกร้าน + ประวัติราคา\n· ประวัติการนับ + ใบสั่งของ\n· รูปสินค้า + รูปหมวด\n\nเก็บไว้:\n· ร้านทั้ง " + shops.length + " ร้าน (ชื่อ สี ลาย โลโก้)\n· หมวดหมู่ + หน่วยนับ\n· PIN เจ้าของ\n\nยืนยัน?")) return;
    if (prompt('พิมพ์คำว่า  ล้างทั้งหมด  เพื่อยืนยัน') !== "ล้างทั้งหมด") { say("ยกเลิกแล้ว"); return; }
    say("กำลังล้าง…");
    let n = 0;
    for (const sh of shops) {
      const d = await getDoc("stockItems/" + sh.id);
      n += ((d && d.items) || []).length;
      await txDoc("stockItems/" + sh.id, cur => ({ ...cur, items: [] }));   // เก็บ cats/units ไว้
      await setDoc("stockPhotos/" + sh.id, { p:{} });
      await clearRecords(sh.id);
    }
    setItems([]); setCounts({}); setOrders({}); setOrderDraft({}); setOrderVendor({});
    writeUndo(shopId, []);
    say(`ล้างแล้ว ${n} รายการ · ร้านทั้ง ${shops.length} ร้านยังอยู่ ✓`);
  };

  const exportJson = () => {
    const blob = new Blob([JSON.stringify({ shop:shopId, cats, units, vendors:vendorList, items }, null, 1)], { type:"application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = `stock-${shopId}-${today()}.json`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  };
  const importJson = file => {
    const fr = new FileReader();
    fr.onload = async () => {
      try {
        const d = JSON.parse(fr.result);
        if (!Array.isArray(d.items)) throw new Error("ไฟล์ไม่ถูกต้อง");
        if (!confirm(`นำเข้า ${d.items.length} รายการ ทับข้อมูลร้านนี้?`)) return;
        if (Array.isArray(d.vendors) && d.vendors.length) await saveVendors([...vendors, ...d.vendors]);
        setItems(d.items);
        await txDoc("stockItems/" + shopId, cur => ({ ...cur, items:d.items, cats:d.cats || cats, units:d.units || units }));
        say("นำเข้าแล้ว ✓");
      } catch (e) { alert("นำเข้าไม่สำเร็จ: " + e.message); }
    };
    fr.readAsText(file);
  };

  const vendorList = useMemo(() => {
    const set = new Set(vendors.filter(Boolean));
    shopVendors.forEach(v => { if (v) set.add(v); });
    items.forEach(i => { if (i.vendor) set.add(i.vendor); });
    return [...set].sort((a, b) => a.localeCompare(b, "th"));
  }, [vendors, shopVendors, items]);

  /* ย้ายรายชื่อเก่าที่เก็บแยกร้านขึ้นส่วนกลางให้เอง */
  useEffect(() => {
    if (LOCAL_MODE || loadingShop || !shopId) return;
    if (vendorList.length && vendorList.length !== vendors.length) saveVendors(vendorList);
  }, [vendorList, vendors, loadingShop, shopId]);

  /* ---- ยอดล่าสุดจากการนับ ---- */
  const latest = useMemo(() => {
    const all = Object.values(counts).flat().sort((a, b) => (b.ts || 0) - (a.ts || 0));
    const map = {};
    all.forEach(c => (c.lines || []).forEach(l => {
      if (map[l.itemId] === undefined) map[l.itemId] = { qty:Number(l.qty), date:c.date };
    }));
    return { map, last: all[0] || null, all };
  }, [counts]);

  const lowItems = useMemo(() => items.filter(i => {
    const q = latest.map[i.id];
    return Number(i.min) > 0 && q !== undefined && q.qty <= Number(i.min);
  }), [items, latest]);

  const neverCounted = useMemo(() => items.filter(i => latest.map[i.id] === undefined), [items, latest]);

  const addToOrder = (id, qty) => {
    setOrderDraft(p => ({ ...p, [id]: qty !== undefined ? qty : (p[id] || 0) + 1 }));
    say("ใส่ในรายการสั่งของแล้ว");
  };

  if (booting) return (
    <div style={{ minHeight:"70vh", display:"flex", flexDirection:"column",
      alignItems:"center", justifyContent:"center", gap:14, padding:24 }}>
      <img src="logo-wordmark.png" alt="Stock PLP" style={{ width:"78%", maxWidth:300 }} />
      <div style={{ color:"var(--muted)", fontSize:13 }}>กำลังโหลด…</div>
    </div>
  );

  const TABS = [
    { k:"stock",  ic:"📦", t:"รายการของ" },
    { k:"count",  ic:"📋", t:"นับสต๊อก" },
    { k:"order",  ic:"🛒", t:"สั่งของ" },
    { k:"hist",   ic:"🕘", t:"ประวัติ" },
    { k:"setup",  ic:"⚙️", t:"ตั้งค่า" },
  ];
  const orderCount = Object.values(orderDraft).filter(v => Number(v) > 0).length;

  return (
    <div style={{ paddingBottom:80 }}>
      <Header shop={shop} shops={shops} logos={logos} setShopId={setShopId} isOwner={isOwner} onRole={askOwner}
        onHelp={() => setSheet({ type:"help" })} onUndo={undoLast} undoCount={undoStack.length}
        items={items.length} low={lowItems.length} lastDate={latest.last ? latest.last.date : null} />

      {!LOCAL_MODE ? (
        <div style={{ display:"flex", justifyContent:"center", marginTop:8 }}>
          <span style={{ fontSize:11.5, color: online ? "var(--green)" : "var(--muted)",
            background:"#fff", border:"1px solid var(--line)", borderRadius:999, padding:"3px 12px" }}>

function priceTrend(it) {
  const cur = Number(it.price) || 0;
  if (!cur) return null;
  // ข้ามประวัติราคา 0 (เกิดจากตอนสร้างรายการที่ยังไม่ได้ใส่ราคา)
  const hist = (it.ph || []).filter(h => Number(h.price) > 0)
    .sort((a, b) => (b.ts || 0) - (a.ts || 0));
  if (!hist.length) return { first: true };
  const idx = hist.findIndex(h => Number(h.price) === cur);
  const prev = idx >= 0 ? hist[idx + 1] : hist[0];
  if (!prev) return { first: true };
  const diff = cur - Number(prev.price);
  return { first: false, same: diff === 0, up: diff > 0, diff, from: prev };
}

function TrendTag({ t, big }) {
  if (!t) return null;
  const st = { fontSize: big ? 13 : 12, marginLeft: big ? 8 : 6 };
  if (t.first) return <span style={{ ...st, color:"var(--muted)" }}>– ราคาแรก</span>;
  if (t.same)  return <span style={{ ...st, color:"var(--muted)" }}>= เท่าเดิม</span>;
  return (
    <span style={{ ...st, color: t.up ? "var(--red)" : "var(--green)" }}>
      {t.up ? "▲" : "▼"} {nf(Math.abs(t.diff))}{big ? (t.up ? " แพงขึ้น" : " ถูกลง") : ""}
    </span>
  );
}

        <div className="kv"><span style={{ color:"var(--muted)" }}>หมวด</span><span>{item.cat}</span></div>
        <div className="kv"><span style={{ color:"var(--muted)" }}>หน่วยนับ</span><span>{item.unit}</span></div>

        <div className="kv">

        </div> : ph.length === 1 ? <div style={{ color:"var(--muted)", fontSize:12.5, padding:"4px 0 8px" }}>

        </div> : null}
        {ph.map((h, i) => (

            <span style={{ fontSize:13 }}>
              {thDate(h.date)}
              <span style={{ color:"var(--muted)" }}>{h.vendor ? " · " + h.vendor : ""}{h.brand ? " · " + h.brand : ""}</span>
            </span>
            <b>{money(h.price)}</b>

      <div className="row" style={{ gap:8 }}>

  );
}

/* ---------- เพิ่ม/แก้ไขรายการ ---------- */
function ItemSheet({ item, cats, units, vendors, isOwner, photo, onClose, onSave, onDelete }) {
  const [f, setF] = useState(() => item ? { ...item } : {
    id:uid(), name:"", brand:"", detail:"", cat:cats[0] || "", unit:units[0] || "ชิ้น",
    packUnit:"", packSize:0, price:0, min:0, vendor:"", ph:[]
  });
  const [img, setImg] = useState(photo || null);
  const [dirty, setDirty] = useState(false);
  const fileRef = useRef(null);
  const set = (k, v) => setF(p => ({ ...p, [k]: v }));

  const pick = async e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setImg(await compressImg(file, 400, 0.6)); setDirty(true);
  };

  const submit = () => {
    if (!f.name.trim()) { alert("ใส่ชื่อของก่อน"); return; }
    if (f.packUnit && Number(f.packSize) < 2) { alert(`ใส่ว่า 1 ${f.packUnit} มีกี่${f.unit}`); return; }
    const next = { ...f, name:f.name.trim(), brand:(f.brand||"").trim(), detail:(f.detail||"").trim(),
      vendor:(f.vendor||"").trim(), price:Number(f.price)||0, min:Number(f.min)||0,
      packUnit: f.packUnit || "", packSize: f.packUnit ? Number(f.packSize) || 0 : 0 };
    const changed = next.price > 0 &&
      (!item || Number(item.price) !== next.price || (item.vendor||"") !== next.vendor || (item.brand||"") !== next.brand);
    if (changed) {
      next.ph = [{ ts:Date.now(), date:today(), price:next.price, vendor:next.vendor, brand:next.brand },
                 ...(f.ph || []).filter(h => Number(h.price) > 0)].slice(0, 20);
    }
    onSave(next, dirty ? img : undefined);
  };

  return (
    <Sheet title={item ? "แก้ไขรายการ" : "เพิ่มรายการใหม่"} onClose={onClose}>
      <div className="row" style={{ marginBottom:14 }}>
        <div className="press" onClick={() => fileRef.current && fileRef.current.click()}
          style={{ width:78, height:78, borderRadius:16, background:"var(--soft)", display:"flex",
            alignItems:"center", justifyContent:"center", overflow:"hidden", fontSize:26, flex:"none" }}>
          {img ? <img src={img} alt="" style={{ width:"100%", height:"100%", objectFit:"cover" }} /> : "📷"}
        </div>
        <div style={{ flex:1 }}>
          <div style={{ fontSize:12.5, color:"var(--muted)" }}>แตะเพื่อใส่รูปสินค้า</div>
          {img ? <button className="chip press" style={{ marginTop:6, color:"var(--red)" }}
            onClick={() => { setImg(null); setDirty(true); }}>ลบรูป</button> : null}
        </div>
        <input ref={fileRef} type="file" accept="image/*" onChange={pick} style={{ display:"none" }} />
      </div>

      <Field label="ชื่อของ *"><input value={f.name} onChange={e => set("name", e.target.value)} placeholder="เช่น น้ำยาซักผ้า 20 ลิตร" /></Field>
      <Field label="ยี่ห้อ" hint="ไม่บังคับ"><input value={f.brand} onChange={e => set("brand", e.target.value)} placeholder="เช่น Kao" /></Field>
      <Field label="รายละเอียด / รุ่น" hint="ไม่บังคับ">
        <textarea rows="2" value={f.detail} onChange={e => set("detail", e.target.value)} placeholder="เช่น สูตรเข้มข้น กลิ่นซากุระ" />
      </Field>
      <div className="row" style={{ gap:8 }}>
        <div style={{ flex:1 }}><Field label="หมวด">
          <select value={f.cat} onChange={e => set("cat", e.target.value)}>{cats.map(c => <option key={c} value={c}>{c}</option>)}</select>
        </Field></div>
        <div style={{ flex:1 }}><Field label="หน่วยนับ" hint="ตอนนับสต๊อก">
          <select value={f.unit} onChange={e => set("unit", e.target.value)}>{units.map(u => <option key={u} value={u}>{u}</option>)}</select>
        </Field></div>
      </div>

      <div style={{ background:"var(--soft)", borderRadius:14, padding:"12px 12px 4px", marginBottom:12 }}>
        <Field label="ซื้อเป็นแพ็ค / ลัง หรือไม่" hint={`นับเป็น${f.unit} แต่ซื้อเป็นลัง`}>
          <select value={f.packUnit || ""} onChange={e => set("packUnit", e.target.value)}>
            <option value="">ไม่ใช้ — ซื้อเป็น{f.unit}เหมือนตอนนับ</option>
            {units.filter(u => u !== f.unit).map(u => <option key={u} value={u}>ซื้อเป็น{u}</option>)}
          </select>
        </Field>
        {f.packUnit ? (
          <Field label={`1 ${f.packUnit} มีกี่${f.unit}`}>
            <input type="number" inputMode="numeric" value={f.packSize || ""}
              onChange={e => set("packSize", e.target.value)} placeholder="เช่น 48" />
            {Number(f.packSize) > 1 ? (
              <div style={{ fontSize:12, color:"var(--head)", marginTop:6, fontWeight:500 }}>
                ✓ 1 {f.packUnit} = {nf(f.packSize)} {f.unit} · นับเป็น{f.unit} · สั่งเป็น{f.packUnit}
              </div>
            ) : null}
          </Field>
        ) : null}
      </div>
      <Field label="ซื้อจากที่ไหน" hint="พิมพ์เอง หรือกดเลือกจากที่เคยใช้">
        <input value={f.vendor} onChange={e => set("vendor", e.target.value)} placeholder="เช่น แม็คโคร / ร้านเคมีภัณฑ์" />
        {vendors.length ? (
          <div style={{ display:"flex", gap:6, flexWrap:"wrap", marginTop:8 }}>
            {vendors.map(v => (
              <button key={v} className={"chip press " + (f.vendor === v ? "on" : "")}
                onClick={() => set("vendor", f.vendor === v ? "" : v)}>{v}</button>
            ))}
          </div>
        ) : null}
      </Field>
      <div className="row" style={{ gap:8 }}>
        <div style={{ flex:1 }}><Field label={`ราคาต่อ 1 ${f.packUnit && Number(f.packSize) > 1 ? f.packUnit : f.unit}`}>
          <input type="number" inputMode="decimal" value={f.price} onChange={e => set("price", e.target.value)} /></Field></div>
        <div style={{ flex:1 }}><Field label={`ขั้นต่ำที่ควรมี (${f.unit})`}>
          <input type="number" inputMode="decimal" value={f.min} onChange={e => set("min", e.target.value)} /></Field></div>
      </div>
      <div style={{ fontSize:11.5, color:"var(--muted)", marginBottom:14, lineHeight:1.6 }}>
        💡 เปลี่ยนราคา ยี่ห้อ หรือร้านที่ซื้อ ระบบจะเก็บเป็นประวัติให้อัตโนมัติ ไว้เทียบว่าขึ้นหรือลง
      </div>

      <div className="row" style={{ gap:8 }}>
        {item && isOwner ? <button className="btn danger press" onClick={() => onDelete(item)}>ลบ</button> : null}
        <button className="btn press" style={{ flex:1 }} onClick={submit}>บันทึก</button>
      </div>
    </Sheet>
  );
}

/* ---------- TAB 2: นับสต๊อก ---------- */
function TabCount({ items, cats, photos, latest, shop, shopLogo, saveCount, say, setTab, editRec, setEditRec }) {
  const [vals, setVals] = useState({});
  const [by, setBy] = useState(LS.get("ps_by") || "");
  const [date, setDate] = useState(today());
  const [note, setNote] = useState("");
  const [cat, setCat] = useState("*");
  const [done, setDone] = useState(null);
  const [editId, setEditId] = useState("");
  const [view, setView] = useState(LS.get("ps_cview") || "card");
  const setV = v => { setView(v); LS.set("ps_cview", v); };

  useEffect(() => {
    if (!editRec || editRec.kind !== "count") return;
    const r = editRec.rec, v = {};
    (r.lines || []).forEach(l => { v[l.itemId] = String(l.qty); });
    setVals(v); setDate(r.date); setBy(r.by || ""); setNote(r.note || ""); setEditId(r.id);
    setDone(null); setEditRec(null);
  }, [editRec]);

  const list = useMemo(() => {
    let r = items.slice();
    if (cat !== "*") r = r.filter(i => i.cat === cat);
    return r.sort((a, b) => (a.cat || "").localeCompare(b.cat || "", "th") || (a.name || "").localeCompare(b.name || "", "th"));
  }, [items, cat]);

  const filled = items.filter(i => vals[i.id] !== undefined && vals[i.id] !== "").length;

  const submit = async () => {
    const lines = items.filter(i => vals[i.id] !== undefined && vals[i.id] !== "")
      .map(i => ({ itemId:i.id, qty:Number(vals[i.id]) }));
    if (!lines.length) { say("ยังไม่ได้กรอกยอดเลย"); return; }
    if (!confirm(`${editId ? "แก้ไขการนับเดิม" : "บันทึกการนับ"} ${lines.length} รายการ วันที่ ${thDate(date)} ?`)) return;
    LS.set("ps_by", by);
    const session = { id: editId || uid(), ts:Date.now(), date, by:by.trim(), note:note.trim(), lines };
    await saveCount(session);
    setDone(session); setVals({}); setNote(""); setEditId("");
  };

  if (done) return <CountDone session={done} items={items} shop={shop} shopLogo={shopLogo} say={say}
    onNew={() => setDone(null)} onGoOrder={() => { setDone(null); setTab("order"); }} />;

  return (
    <div style={{ padding:"14px 0 0" }}>
      {editId ? (
        <div style={{ margin:"0 16px 12px", background:"#FFF3E2", border:"1px solid #F0D9B4",
          borderRadius:14, padding:"10px 13px", fontSize:12.5, display:"flex", gap:10, alignItems:"center" }}>
          <span style={{ flex:1 }}>✏️ กำลังแก้ไขการนับของวันที่ <b>{thDate(date)}</b> — บันทึกแล้วจะทับของเดิม</span>
          <button className="chip press" onClick={() => { setEditId(""); setVals({}); setNote(""); }}>ยกเลิก</button>
        </div>
      ) : null}

      <div style={{ padding:"0 16px 12px" }}>
        <div className="card" style={{ padding:13 }}>
          <div className="row" style={{ gap:8 }}>
            <div style={{ flex:1 }}><Field label="วันที่นับ"><input type="date" value={date} onChange={e => setDate(e.target.value)} /></Field></div>
            <div style={{ flex:1 }}><Field label="ผู้นับ"><input value={by} onChange={e => setBy(e.target.value)} placeholder="ชื่อ" /></Field></div>
          </div>
          <Field label="หมายเหตุ" hint="ไม่บังคับ"><input value={note} onChange={e => setNote(e.target.value)} placeholder="เช่น นับหลังปิดร้าน" /></Field>
          <div style={{ fontSize:13, color:"var(--muted)" }}>
            กรอกแล้ว <b style={{ color:"var(--head)" }}>{filled}</b> / {items.length} รายการ · ช่องที่เว้นว่างจะไม่ถูกบันทึก
          </div>
        </div>
      </div>

      <div style={{ padding:"0 16px 10px", display:"flex", gap:8 }}>
        <button className={"chip press " + (view === "card" ? "on" : "")} style={{ flex:1, padding:"8px 0", textAlign:"center" }}
          onClick={() => setV("card")}>🃏 การ์ด</button>
        <button className={"chip press " + (view === "table" ? "on" : "")} style={{ flex:1, padding:"8px 0", textAlign:"center" }}
          onClick={() => setV("table")}>📊 ตาราง</button>
        <button className="chip press" style={{ padding:"8px 14px" }}
          onClick={() => shareCanvas(renderFormImage({ shop, items, latest, vals:{}, withValues:false }),
            `form-blank-${today()}.png`, say)}>🖼 ฟอร์มเปล่า</button>
      </div>

      <div className="scroll-x">
        <button className={"chip press " + (cat === "*" ? "on" : "")} onClick={() => setCat("*")}>ทั้งหมด</button>
        {cats.map(c => <button key={c} className={"chip press " + (cat === c ? "on" : "")} onClick={() => setCat(c)}>{c}</button>)}
      </div>

      {view === "table" ? <CountTable {...{ list, vals, setVals, latest }} /> : null}

      {view === "card" ? (
      <div style={{ padding:"0 16px", display:"grid", gap:7 }}>
        {list.map(i => {
          const v = vals[i.id];
          const has = v !== undefined && v !== "";
          const low = has && Number(i.min) > 0 && Number(v) <= Number(i.min);
          const prev = latest.map[i.id];
          return (
            <div key={i.id} className="card" style={{ padding:"10px 12px", display:"flex", gap:10, alignItems:"center",
              borderColor: low ? "#EFC3C9" : has ? "#CFE3D6" : "var(--line)" }}>
              {photos[i.id] ? <img className="thumb" style={{ width:38, height:38 }} src={photos[i.id]} alt="" />
                            : <div className="thumb" style={{ width:38, height:38, fontSize:16 }}>📦</div>}
              <div style={{ flex:1, minWidth:0 }}>
                <div style={{ fontSize:14, fontWeight:500, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{i.name}</div>
                <div style={{ fontSize:11, color:"var(--muted)" }}>
                  {prev ? `ครั้งก่อน ${nf(prev.qty)}` : "ยังไม่เคยนับ"}{Number(i.min) > 0 ? ` · ขั้นต่ำ ${nf(i.min)}` : ""}
                </div>
              </div>
              {low ? <span className="tag" style={{ background:"#FBE5E8", color:"var(--red)" }}>ต้องสั่ง</span> : null}
              <input type="number" inputMode="decimal" placeholder={i.unit} value={v === undefined ? "" : v}
                onChange={e => setVals(p => ({ ...p, [i.id]: e.target.value }))}
                style={{ width:88, textAlign:"center", fontWeight:600 }} />
            </div>
          );
        })}
      </div>
      ) : null}

      <div style={{ padding:"14px 16px 0" }}>
        <button className="btn gold press" style={{ width:"100%" }} onClick={submit}>
          {editId ? "💾 บันทึกทับของเดิม" : "✅ บันทึกผลนับ"} {filled ? `(${filled} รายการ)` : ""}
        </button>
        <button className="btn ghost press" style={{ width:"100%", marginTop:8 }}
          onClick={() => shareCanvas(renderFormImage({ shop, items, latest, vals, withValues:true }),
            `form-${today()}.png`, say)}>
          🖼 ส่งตารางพร้อมยอดเป็นรูป
        </button>
      </div>
    </div>
  );
}

/* ---------- ตารางนับสต๊อก แบบชีต Excel ---------- */

  const groups = useMemo(() => groupByVendor(list), [list]);
  if (!list.length) return null;

  return (
    <div style={{ padding:"0 16px 4px" }}>
      <div className="tblwrap">
        <table className="tbl">
          <thead>
            <tr>
              <th style={{ minWidth:58 }}>ควรมี</th>
              <th style={{ minWidth:96 }}>หน่วย</th>
              <th style={{ minWidth:84 }}>เหลือ</th>
              <th style={{ minWidth:58 }}>สั่ง</th>
              <th style={{ textAlign:"left", minWidth:160 }}>รายการ</th>
              <th style={{ minWidth:74 }}>ปริมาณ</th>
              <th style={{ minWidth:58 }}>ราคา</th>
            </tr>
          </thead>
          <tbody>
            {groups.map(([vendor, arr], gi) => (
              <React.Fragment key={vendor}>
                <tr className="band"><td colSpan="7" style={{ background:BAND[gi % BAND.length] }}>
                  🏬 {vendor} · {arr.length} รายการ
                </td></tr>
                {arr.map(i => {
                  const v = vals[i.id];
                  const has = v !== undefined && v !== "";
                  const low = has && Number(i.min) > 0 && Number(v) <= Number(i.min);
                  const need = low ? suggestQty(i, { map:{ [i.id]:{ qty:Number(v) } } }) : 0;
                  const p = packOf(i);
                  return (
                    <tr key={i.id} className={low ? "low" : ""}>
                      <td className="num" style={{ color:"var(--muted)" }}>{Number(i.min) > 0 ? nf(i.min) : "–"}</td>
                      <td style={{ fontSize:11, color:"var(--muted)" }}>
                        {i.unit}{p ? <span><br/>(1{p.unit}มี{nf(p.size)}{i.unit})</span> : null}
                      </td>
                      <td className={has ? "doing" : ""}>
                        <input className="cnt" type="number" inputMode="decimal" placeholder="–"
                          value={v === undefined ? "" : v}
                          onChange={e => setVals(pv => ({ ...pv, [i.id]: e.target.value }))} />
                      </td>
                      <td className="num" style={{ color: need ? "var(--gold)" : "var(--muted)" }}>
                        {need ? nf(need) : "–"}
                      </td>
                      <td className="nm">
                        <b>{i.name}</b>
                        {i.brand ? <span style={{ color:"var(--muted)" }}> ({i.brand})</span> : null}
                      </td>
                      <td style={{ fontSize:11, color:"var(--muted)" }}>{i.detail || "–"}</td>
                      <td className="num">{Number(i.price) ? nf(i.price) : "–"}</td>
                    </tr>
                  );
                })}

            ))}
          </tbody>
        </table>
      </div>
      <div style={{ fontSize:11.5, color:"var(--muted)", textAlign:"center", marginTop:8 }}>
        กรอกเฉพาะช่อง <b>เหลือ</b> · ช่อง <b>สั่ง</b> คำนวณให้เอง · เลื่อนตารางซ้ายขวาได้
      </div>
    </div>
  );
}

function countGroups(session, items) {
  const byCat = {};
  (session.lines || []).forEach(l => {
    const it = items.find(x => x.id === l.itemId);
    if (!it) return;
    const c = it.cat || "อื่นๆ";
    (byCat[c] = byCat[c] || []).push({
      left: it.name + (it.brand ? ` (${it.brand})` : ""),
      right: `${nf(l.qty)} ${it.unit}`,
      flag: Number(it.min) > 0 && Number(l.qty) <= Number(it.min) ? "🔴" : ""
    });
  });
  return Object.entries(byCat).map(([title, lines]) => ({ title, lines }));
}

function CountDone({ session, items, shop, shopLogo, say, onNew, onGoOrder }) {
  const groups = countGroups(session, items);
  const lowN = groups.reduce((s, g) => s + g.lines.filter(l => l.flag).length, 0);
  const head = `${thDate(session.date)}${session.by ? " · ผู้นับ: " + session.by : ""}${session.note ? " · " + session.note : ""}`;
  const footer = `รวม ${(session.lines || []).length} รายการ · ต้องสั่ง ${lowN} รายการ`;

  return (
    <div style={{ padding:"16px" }}>
      <div className="card" style={{ padding:20, textAlign:"center", marginBottom:14 }}>
        <div style={{ fontSize:44 }}>✅</div>
        <div style={{ fontWeight:600, fontSize:17, margin:"6px 0 3px" }}>บันทึกการนับแล้ว</div>
        <div style={{ color:"var(--muted)", fontSize:13 }}>{head}</div>
        <div style={{ marginTop:10, fontSize:14 }}>

        </button>
        <button className="btn gold press" onClick={async () => shareCanvas(
          await renderImage({ title:"นับสต๊อก · " + (shop ? shop.name : ""), head, groups, footer,

          `count-${session.date}.png`, say)}>

/* ---------- TAB 3: สั่งของ ---------- */
function TabOrder({ items, latest, lowItems, orderDraft, setOrderDraft, orderVendor, setOrderVendor, vendors, shop, shopLogo, saveOrder, say, editRec, setEditRec }) {
  const [by, setBy] = useState(LS.get("ps_by") || "");
  const [note, setNote] = useState("");
  const [pick, setPick] = useState(false);
  const [editId, setEditId] = useState("");
  const [touched, setTouched] = useState({});   // รายการที่ผู้ใช้ปรับจำนวนเอง

  useEffect(() => {
    if (!editRec || editRec.kind !== "order") return;
    const r = editRec.rec;
    setBy(r.by || ""); setNote(r.note || ""); setEditId(r.id);
    setTouched(Object.fromEntries((r.lines || []).map(l => [l.itemId, true])));
    setEditRec(null);
  }, [editRec]);
  const [q, setQ] = useState("");

  /* เติมค่าแนะนำให้อัตโนมัติ และคำนวณใหม่เมื่อข้อมูลของเปลี่ยน
     (เช่น เพิ่งตั้งค่า 1 ลัง = 48 กระป๋อง) — ยกเว้นรายการที่ผู้ใช้แก้เอง */
  useEffect(() => {
    setOrderDraft(prev => {
      const next = { ...prev };
      let changed = false;
      lowItems.forEach(i => {
        if (touched[i.id]) return;
        const q = suggestQty(i, latest);
        if (Number(next[i.id]) !== q) { next[i.id] = q; changed = true; }
      });
      return changed ? next : prev;
    });
  }, [items, latest, lowItems, touched]);

  const chosen = items.filter(i => Number(orderDraft[i.id]) > 0);

  /* ร้านที่จะไปซื้อของชิ้นนี้ — เปลี่ยนได้รายรายการ */
  const vendorOf = i => orderVendor[i.id] || i.vendor || "ไม่ระบุร้าน";

  /* ราคาที่เคยซื้อจากร้านนั้น ถ้าไม่เคยซื้อใช้ราคาหลักของรายการ */
  const priceOf = (i, v) => {
    const h = (i.ph || []).filter(x => (x.vendor || "ไม่ระบุร้าน") === v && Number(x.price) > 0)
      .sort((a, b) => (b.ts || 0) - (a.ts || 0));
    return h.length ? Number(h[0].price) : Number(i.price) || 0;
  };

  /* รายชื่อร้านที่เคยซื้อของชิ้นนี้ จะขึ้นก่อนในตัวเลือก */
  const vendorsFor = i => {
    const seen = [];
    if (i.vendor) seen.push(i.vendor);
    (i.ph || []).forEach(h => { if (h.vendor && !seen.includes(h.vendor)) seen.push(h.vendor); });
    const rest = vendors.filter(v => !seen.includes(v));
    return { seen, rest };
  };

  const total = chosen.reduce((s, i) => s + Number(orderDraft[i.id]) * priceOf(i, vendorOf(i)), 0);

  const groups = useMemo(() => {
    const byVendor = {};
    chosen.forEach(i => {
      const v = vendorOf(i);
      (byVendor[v] = byVendor[v] || []).push({
        left: i.name + (i.brand ? ` (${i.brand})` : ""),
        right: qtyLabel(i, orderDraft[i.id]),
        sub: money(Number(orderDraft[i.id]) * priceOf(i, v))
      });
    });
    return Object.entries(byVendor).map(([title, lines]) => ({ title, lines }));
  }, [chosen, orderDraft, orderVendor]);

  const head = `${thDate(today())}${by ? " · สั่งโดย: " + by : ""}${note ? " · " + note : ""}`;
  const footer = `รวม ${chosen.length} รายการ · ประมาณ ${money(total)}`;

  const searchList = useMemo(() => {
    const s = q.trim().toLowerCase();
    return items.filter(i => !s || [i.name, i.brand, i.vendor].join(" ").toLowerCase().includes(s))
      .sort((a, b) => (a.name || "").localeCompare(b.name || "", "th")).slice(0, 40);
  }, [items, q]);

  const save = async () => {
    if (!chosen.length) { say("ยังไม่ได้เลือกของ"); return; }
    LS.set("ps_by", by);
    await saveOrder({ id: editId || uid(), ts:Date.now(), date: editId ? (editRec && editRec.rec ? editRec.rec.date : today()) : today(),
      by:by.trim(), note:note.trim(), total,
      lines: chosen.map(i => ({ itemId:i.id, qty:Number(orderDraft[i.id]),
        price: priceOf(i, vendorOf(i)), vendor: vendorOf(i) })) });
    setEditId(""); say(editId ? "แก้ไขใบสั่งของแล้ว ✓" : "บันทึกใบสั่งของแล้ว ✓");
  };

  return (
    <div style={{ padding:"14px 16px" }}>
      <div className="card" style={{ padding:13, marginBottom:12 }}>
        <div className="row" style={{ gap:8 }}>
          <div style={{ flex:1 }}><Field label="ผู้สั่ง"><input value={by} onChange={e => setBy(e.target.value)} placeholder="ชื่อ" /></Field></div>
          <div style={{ flex:1.3 }}><Field label="หมายเหตุ"><input value={note} onChange={e => setNote(e.target.value)} placeholder="เช่น ซื้อพรุ่งนี้เช้า" /></Field></div>
        </div>
        <div style={{ display:"flex", gap:8 }}>
          <Stat label="เลือกแล้ว" value={chosen.length} sub="รายการ" />
          <Stat label="ราคาประมาณ" value={money(total)} color="var(--gold)" />
        </div>
        <div style={{ fontSize:11.5, color:"var(--muted)", marginTop:9, lineHeight:1.6 }}>
          💡 จำนวนที่ขึ้นให้อัตโนมัติ = <b>ขั้นต่ำ − ที่เหลือ</b> (เติมให้พอถึงขั้นต่ำ) ปรับเพิ่มลดได้ตามต้องการ
        </div>
      </div>

      <div style={{ display:"flex", gap:8, marginBottom:12 }}>
        <button className="btn ghost press" style={{ flex:1 }} onClick={() => setPick(!pick)}>
          {pick ? "✕ ปิดรายการ" : "➕ เพิ่มของเอง"}
        </button>
        <button className="btn ghost press" onClick={() => {
          const d = {}; lowItems.forEach(i => { d[i.id] = suggestQty(i, latest); });
          setTouched({}); setOrderDraft(d); say(`คำนวณใหม่ ${Object.keys(d).length} รายการ`);
        }}>↺ ค่าแนะนำ</button>
        <button className="btn ghost press" onClick={() => {
          setTouched(Object.fromEntries(lowItems.map(i => [i.id, true])));
          setOrderDraft({}); setOrderVendor({});
        }}>ล้าง</button>
      </div>

      {pick ? (
        <div className="card" style={{ padding:12, marginBottom:12 }}>
          <input placeholder="🔍 ค้นหาของที่จะสั่ง" value={q} onChange={e => setQ(e.target.value)} style={{ marginBottom:10 }} />
          <div style={{ maxHeight:280, overflow:"auto", display:"grid", gap:6 }}>
            {searchList.map(i => {
              const on = Number(orderDraft[i.id]) > 0;
              return (
                <button key={i.id} className="press" onClick={() => {
                  setTouched(t => ({ ...t, [i.id]:true }));
                  setOrderDraft(p => { const n = { ...p }; if (on) delete n[i.id]; else n[i.id] = 1; return n; });
                }} style={{ textAlign:"left", padding:"9px 11px", borderRadius:12,
                  border:"1px solid " + (on ? "var(--head)" : "var(--line)"), background: on ? "var(--soft)" : "#fff",
                  display:"flex", gap:8, alignItems:"center" }}>
                  <span style={{ flex:1, fontSize:13.5 }}>{i.name}
                    <span style={{ color:"var(--muted)", fontSize:11.5 }}>{i.vendor ? " · " + i.vendor : ""}</span>
                  </span>
                  <span style={{ fontSize:12, color:"var(--muted)" }}>{money(i.price)}</span>
                  <span>{on ? "✓" : "＋"}</span>
                </button>
              );
            })}
          </div>
        </div>
      ) : null}

      {!chosen.length ? (
        <div className="empty">
          <img className="emptypic" src="empty-box.jpg" alt="" />
          ยังไม่มีของในรายการสั่ง<br/>ระบบจะใส่ของที่ต่ำกว่าขั้นต่ำให้อัตโนมัติหลังนับสต๊อก
        </div>
      ) : null}

      {groups.map(g => (
        <div key={g.title} style={{ marginBottom:12 }}>
          <div className="sect" style={{ margin:"4px 2px 6px" }}>🏬 {g.title}</div>
          <div className="card" style={{ padding:"4px 12px" }}>
            {chosen.filter(i => vendorOf(i) === g.title).map(i => {
              const v = vendorOf(i);
              const p = priceOf(i, v);
              const other = p !== (Number(i.price) || 0);
              const vf = vendorsFor(i);
              return (
                <div key={i.id} style={{ padding:"9px 0", borderBottom:"1px solid var(--line)" }}>
                  <div style={{ display:"flex", gap:8, alignItems:"center" }}>
                    <div style={{ flex:1, minWidth:0 }}>
                      <div style={{ fontSize:14, fontWeight:500 }}>{i.name}</div>
                      <div style={{ fontSize:11.5, color:"var(--muted)" }}>
                        <b style={{ color: other ? "var(--gold)" : "var(--muted)" }}>{money(p)}</b>/{orderUnit(i)}
                        {latest.map[i.id] ? ` · เหลือ ${nf(latest.map[i.id].qty)} ${i.unit}` : " · ยังไม่เคยนับ"}
                        {Number(i.min) > 0 ? ` · ขั้นต่ำ ${nf(i.min)}` : ""}
                        {` · รวม ${money(Number(orderDraft[i.id]) * p)}`}
                      </div>
                    </div>
                    <button className="press" onClick={() => { setTouched(t => ({ ...t, [i.id]:true }));
                      setOrderDraft(p2 => ({ ...p2, [i.id]: Math.max(0, Number(p2[i.id] || 0) - 1) })); }}
                      style={{ width:34, height:34, borderRadius:10, background:"var(--soft)" }}>−</button>
                    <input type="number" inputMode="decimal" value={orderDraft[i.id]}
                      onChange={e => { setTouched(t => ({ ...t, [i.id]:true }));
                        setOrderDraft(p2 => ({ ...p2, [i.id]: e.target.value })); }}
                      style={{ width:56, textAlign:"center", fontWeight:600, padding:"7px 4px" }} />
                    <button className="press" onClick={() => { setTouched(t => ({ ...t, [i.id]:true }));
                      setOrderDraft(p2 => ({ ...p2, [i.id]: Number(p2[i.id] || 0) + 1 })); }}
                      style={{ width:34, height:34, borderRadius:10, background:"var(--soft)" }}>＋</button>
                  </div>
                  {packOf(i) ? (
                    <div style={{ fontSize:11.5, color:"var(--head)", marginTop:5, fontWeight:500 }}>
                      = {nf(toCountQty(i, orderDraft[i.id]))} {i.unit} ({nf(orderDraft[i.id])} {i.packUnit})
                    </div>
                  ) : null}
                  <div className="row" style={{ gap:6, marginTop:7 }}>
                    <span style={{ fontSize:11.5, color:"var(--muted)", flex:"none" }}>🏬 ซื้อจาก</span>
                    <select value={v} onChange={e => setOrderVendor(p2 => ({ ...p2, [i.id]: e.target.value }))}
                      style={{ padding:"6px 9px", fontSize:13.5 }}>
                      {vf.seen.map(x => <option key={x} value={x}>{x}{(i.ph || []).some(h => h.vendor === x) ? " ✓เคยซื้อ" : ""}</option>)}
                      {vf.rest.length ? <optgroup label="ร้านอื่น">
                        {vf.rest.map(x => <option key={x} value={x}>{x}</option>)}
                      </optgroup> : null}
                      <option value="ไม่ระบุร้าน">ไม่ระบุร้าน</option>
                    </select>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      ))}

      {chosen.length ? (
        <div style={{ display:"grid", gap:8, marginTop:6 }}>
          <button className="btn press" onClick={() => copyText(
            buildText("🛒 รายการสั่งซื้อ", shop ? shop.name : "", head, groups, footer), say)}>
            📋 คัดลอกเป็นข้อความ
          </button>
          <button className="btn gold press" onClick={async () => shareCanvas(
            await renderImage({ title:"รายการสั่งซื้อ · " + (shop ? shop.name : ""), head, groups, footer,
              color: colorOf(shop && shop.color).head, logo: shopLogo }), `order-${today()}.png`, say)}>
            🖼 ส่งเป็นรูปภาพ
          </button>
          <button className="btn ghost press" onClick={save}>{editId ? "💾 บันทึกทับใบเดิม" : "💾 บันทึกใบสั่งของ"}</button>
        </div>
      ) : null}
    </div>
  );
}

/* ถ้าตั้งค่าซื้อเป็นแพ็ค/ลัง จะคืนขนาดแพ็ค ไม่งั้นคืน null */
function packOf(i) {
  const n = Number(i.packSize) || 0;
  return (n > 1 && i.packUnit) ? { size:n, unit:i.packUnit } : null;
}
const orderUnit = i => { const p = packOf(i); return p ? p.unit : i.unit; };
/* แปลงจำนวนที่สั่ง (หน่วยซื้อ) เป็นหน่วยนับ */
const toCountQty = (i, q) => { const p = packOf(i); return p ? Number(q) * p.size : Number(q); };
const qtyLabel = (i, q) => {
  const p = packOf(i);
  return `${nf(q)} ${orderUnit(i)}` + (p ? ` (${nf(toCountQty(i, q))} ${i.unit})` : "");
};

/* จำนวนที่แนะนำ = เติมให้พอถึงขั้นต่ำ (อย่างน้อย 1) */
function suggestQty(i, latest) {
  const cur = latest.map[i.id] ? Number(latest.map[i.id].qty) : 0;
  const need = (Number(i.min) || 0) - cur;           // ขาดอยู่กี่หน่วยนับ
  const p = packOf(i);
  return Math.max(Math.ceil(p ? need / p.size : need), 1);   // ปัดขึ้นเป็นจำนวนลัง/แพ็ค
}

function orderGroups(order, items) {
  const byVendor = {};
  (order.lines || []).forEach(l => {
    const it = items.find(x => x.id === l.itemId);
    const name = it ? it.name + (it.brand ? ` (${it.brand})` : "") : "(ลบแล้ว)";
    const v = l.vendor || (it && it.vendor) || "ไม่ระบุร้าน";
    (byVendor[v] = byVendor[v] || []).push({ left:name, right: it ? qtyLabel(it, l.qty) : nf(l.qty) });
  });
  return Object.entries(byVendor).map(([title, lines]) => ({ title, lines }));
}

function TabSetup({ shops, shop, saveShops, setShopId, cats, units, vendors, saveVendors, items, photos, savePhoto, saveMeta,
                    logos, online, lastSync, dbError, isOwner, cfg, setCfg, setSheet, say, loadSeed, cleanupSeed, wipeShop, resetAll, exportJson, importJson }) {

  const [newUnit, setNewUnit] = useState("");
  const [newVendor, setNewVendor] = useState("");
  const [tapCount, setTapCount] = useState(0);
  const [pin, setPin] = useState(cfg.ownerPin);
  const impRef = useRef(null);
  const catRef = useRef(null);
  const [catTarget, setCatTarget] = useState("");

  if (!isOwner) return (
    <div className="empty" style={{ paddingTop:60 }}>
